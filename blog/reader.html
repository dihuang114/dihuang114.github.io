<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>地荒博客</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&display=swap');

  :root {
    --bg: #ffffff;
    --text: #1a1a1a;          /* 正文（加重） */
    --text-strong: #000000;   /* 标题（最重） */
    --text-muted: #444444;    /* 次要文字 */
    --text-faint: #888888;    /* 元信息 */
    --border: #e0e0e0;
    --border-light: #eeeeee;
    --code-bg: #f5f5f5;
    --code-border: #e8e8e8;
    --hover: #444444;
  }

  [data-theme="dark"] {
    --bg: #1a1a1a;
    --text: #d4d4d4;
    --text-strong: #f0f0f0;
    --text-muted: #b0b0b0;
    --text-faint: #8a8a8a;
    --border: #3a3a3a;
    --border-light: #2e2e2e;
    --code-bg: #242424;
    --code-border: #333333;
    --hover: #aaaaaa;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Serif SC', 'Source Han Serif SC', '思源宋体', serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 4rem 1.5rem 3rem;
    transition: background 0.3s, color 0.3s;
  }

  /* --- Theme Toggle --- */
  .theme-toggle {
    position: fixed;
    top: 1.2rem;
    right: 1.5rem;
    background: none;
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 1.2rem;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    cursor: pointer;
    z-index: 100;
    transition: all 0.3s;
    font-family: inherit;
  }

  .theme-toggle:hover {
    border-color: var(--text);
  }

  /* --- Article Container --- */
  .article {
    max-width: 640px;
    width: 100%;
  }

  /* --- Title --- */
  .article-header {
    text-align: center;
    margin-bottom: 2rem;
  }

  .article-header h1 {
    font-size: 1.8rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    margin-bottom: 0.8rem;
    line-height: 1.4;
    color: var(--text-strong);
  }

  .article-meta {
    font-size: 0.85rem;
    color: var(--text-faint);
    letter-spacing: 0.05em;
  }

  /* 字数统计（标题之下） */
  .article-wordcount {
    margin-top: 0.6rem;
    font-size: 0.8rem;
    color: var(--text-faint);
    letter-spacing: 0.08em;
  }

  .article-collection {
    display: inline-block;
    margin-top: 0.8rem;
    font-size: 0.8rem;
    color: var(--text-muted);
    border: 1px solid var(--border);
    padding: 0.15em 1em;
    border-radius: 1em;
    letter-spacing: 0.1em;
  }

  .divider {
    width: 40px;
    height: 1px;
    background: var(--border);
    margin: 2rem auto;
  }

  /* --- Content Typography --- */
  .article-body {
    font-size: 18px;
    line-height: 2;
    color: var(--text);
    text-align: justify;
  }

  .article-body p {
    margin-bottom: 1.5em;
    text-indent: 2em;
  }

  .article-body h1,
  .article-body h2,
  .article-body h3,
  .article-body h4 {
    font-weight: 700;
    text-align: center;
    margin: 2.5em 0 1.2em;
    letter-spacing: 0.08em;
    line-height: 1.5;
    color: var(--text-strong);
  }

  .article-body h1 { font-size: 1.5rem; }
  .article-body h2 { font-size: 1.3rem; }
  .article-body h3 { font-size: 1.1rem; }

  /* 引用/题记 */
  .article-body blockquote {
    text-align: center;
    font-style: italic;
    color: var(--text-muted);
    margin: 1.5em 0 2.5em;
    font-size: 0.95rem;
    border: none;
  }

  .article-body blockquote p {
    text-indent: 0;
    margin-bottom: 0.5em;
  }

  /* 分隔线 */
  .article-body hr {
    border: none;
    text-align: center;
    margin: 3em 0;
  }

  .article-body hr::after {
    content: '* * *';
    letter-spacing: 1em;
    color: var(--text-faint);
    font-size: 0.9rem;
  }

  /* 列表 */
  .article-body ul,
  .article-body ol {
    margin: 1.5em 0;
    padding-left: 2.5em;
  }

  .article-body li {
    margin-bottom: 0.6em;
  }

  /* 链接 */
  .article-body a {
    color: var(--text-strong);
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  .article-body a:hover {
    color: var(--hover);
  }

  /* 代码 */
  .article-body code {
    font-family: "Consolas", "Menlo", monospace;
    font-size: 0.9em;
    background: var(--code-bg);
    padding: 0.15em 0.4em;
  }

  .article-body pre {
    background: var(--code-bg);
    border: 1px solid var(--code-border);
    padding: 1em 1.2em;
    margin: 1.5em 0;
    overflow-x: auto;
    font-size: 0.9em;
    line-height: 1.6;
  }

  .article-body pre code {
    background: none;
    padding: 0;
  }

  /* --- Loading / Error --- */
  .status {
    text-align: center;
    color: var(--text-faint);
    font-size: 0.95rem;
    padding: 3rem 0;
    font-style: italic;
  }

  /* --- Navigation --- */
  .article-nav {
    display: flex;
    justify-content: space-between;
    margin-top: 4rem;
    padding-top: 2rem;
    border-top: 1px solid var(--border-light);
  }

  .article-nav a {
    font-size: 0.85rem;
    color: var(--text-faint);
    text-decoration: none;
    letter-spacing: 0.04em;
    transition: color 0.3s;
  }

  .article-nav a:hover {
    color: var(--text);
  }

  /* --- Footer --- */
  .site-footer {
    margin-top: 3rem;
    text-align: center;
  }

  .copyright {
    font-size: 0.75rem;
    color: var(--text-faint);
    letter-spacing: 0.03em;
    opacity: 0.7;
  }

  /* --- Responsive --- */
  @media (max-width: 600px) {
    body { padding: 2.5rem 1.2rem 2rem; }
    .article-header h1 { font-size: 1.5rem; }
    .article-body { font-size: 16px; }
  }
</style>
</head>
<body>

<button class="theme-toggle" id="themeToggle" title="切换黑夜模式">🌙</button>

<article class="article">

  <header class="article-header" id="articleHeader" style="display:none;">
    <h1 id="articleTitle"></h1>
    <p class="article-meta" id="articleMeta"></p>
    <p class="article-wordcount" id="articleWordcount"></p>
    <p class="article-collection" id="articleCollection" style="display:none;"></p>
  </header>

  <div class="divider" id="articleDivider" style="display:none;"></div>

  <div class="article-body" id="articleBody">
    <p class="status">加载中…</p>
  </div>

  <nav class="article-nav">
    <a href="/blog/">&larr; 返回目录</a>
    <a href="/">&larr; 返回首页</a>
  </nav>

</article>

<footer class="site-footer">
  <p class="copyright">© 地荒 · 本站内容均为原创</p>
</footer>

<script src="/blog/marked.min.js"></script>
<script src="/blog/posts.js"></script>
<script>
(function() {
  /* --- 黑夜模式 --- */
  (function() {
    var toggle = document.getElementById('themeToggle');
    var html = document.documentElement;
    var saved = localStorage.getItem('dh-blog-theme');
    if (saved) {
      html.setAttribute('data-theme', saved);
    } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
      html.setAttribute('data-theme', 'dark');
    }
    function updateIcon() {
      toggle.textContent = html.getAttribute('data-theme') === 'dark' ? '☀️' : '🌙';
    }
    updateIcon();
    toggle.addEventListener('click', function() {
      var next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('dh-blog-theme', next);
      updateIcon();
    });
  })();

  /* --- 解析 URL 参数 ?file=xxx.md --- */
  var params = new URLSearchParams(window.location.search);
  var file = params.get('file');

  var body = document.getElementById('articleBody');
  var header = document.getElementById('articleHeader');
  var divider = document.getElementById('articleDivider');

  if (!file || !/\.md$/i.test(file)) {
    body.innerHTML = '<p class="status">文章不存在</p>';
    return;
  }

  /* 从 window.POSTS 中查找文章（内容已由 build-posts.js 嵌入，无需 fetch） */
  var fileName = file.replace(/^.*[\\\/]/, '');
  var post = null;
  (window.POSTS || []).forEach(function(p) {
    if (p.file === fileName) post = p;
  });

  if (!post || !post.content) {
    body.innerHTML = '<p class="status">文章加载失败（未找到文章数据，请重新部署）</p>';
    return;
  }

  var title = post.title || '';
  var meta = '';
  if (post.author) meta = post.author;
  if (post.date) meta = meta ? meta + ' | ' + post.date : post.date;
  var collection = post.collection || '';
  var content = post.content;

  // 渲染 markdown
  var html = marked.parse(content);
  body.innerHTML = html;

  // 未指定 title 时，从正文第一个 h1 提取
  if (!title) {
    var h1 = body.querySelector('h1');
    if (h1) title = h1.textContent.trim();
  }

  if (title) {
    document.title = title + ' - 地荒博客';
    document.getElementById('articleTitle').textContent = title;
    document.getElementById('articleMeta').textContent = meta;

    // 字数统计（中文字符数）
    var textContent = body.textContent.replace(/\s+/g, '');
    var count = textContent.length;
    document.getElementById('articleWordcount').textContent = '全文约 ' + count + ' 字';

    if (collection) {
      var cEl = document.getElementById('articleCollection');
      cEl.textContent = '《' + collection + '》';
      cEl.style.display = '';
    }
    header.style.display = '';
    divider.style.display = '';
  }

  // 删除正文中重复的标题 h1（若 front-matter 已提供 title）
  var h1s = body.querySelectorAll('h1');
  h1s.forEach(function(h) {
    if (title && h.textContent.trim() === title) h.remove();
  });
})();
</script>

</body>
</html>
