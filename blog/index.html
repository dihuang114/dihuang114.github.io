<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>地荒的小世界</title>
<link rel="stylesheet" href="https://npm.elemecdn.com/anzhiyu-theme-static@1.1.9/icon/ali_iconfont_css.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&display=swap');

  :root {
    --bg: #ffffff;
    --text: #1a1a1a;          /* 主文字（加重） */
    --text-strong: #000000;   /* 标题（最重） */
    --text-muted: #555555;    /* 摘要（加重） */
    --text-faint: #888888;    /* 元信息 */
    --border: #e0e0e0;
    --border-light: #eeeeee;
    --hover: #444444;
  }

  [data-theme="dark"] {
    --bg: #1a1a1a;
    --text: #d4d4d4;
    --text-strong: #f0f0f0;
    --text-muted: #b0b0b0;
    --text-faint: #8a8a8a;
    --border: #3a3a3a;
    --border-light: #2e2e2e;
    --hover: #aaaaaa;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Serif SC', 'Source Han Serif SC', '思源宋体', serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 4rem 1.5rem 3rem;
    transition: background 0.3s, color 0.3s;
  }

  /* --- Theme Toggle --- */
  .theme-toggle {
    position: fixed;
    top: 1.2rem;
    right: 1.5rem;
    background: none;
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 1.2rem;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    cursor: pointer;
    z-index: 100;
    transition: all 0.3s;
    font-family: inherit;
  }

  .theme-toggle:hover {
    border-color: var(--text);
  }

  .theme-toggle .anzhiyufont {
    font-size: 1.25rem;
  }

  /* --- Header --- */
  .site-header {
    text-align: center;
    margin-bottom: 2.5rem;
  }

  .site-header h1 {
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    margin-bottom: 0.6rem;
    color: var(--text-strong);
  }

  .site-header .subtitle {
    font-size: 0.95rem;
    color: var(--text-faint);
    font-style: italic;
    letter-spacing: 0.08em;
  }

  .divider {
    width: 60px;
    height: 1px;
    background: var(--border);
    margin: 2rem auto;
  }

  /* --- Collection Filter --- */
  .collection-bar {
    max-width: 640px;
    width: 100%;
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem 1.2rem;
    margin-bottom: 1.5rem;
    justify-content: center;
  }

  .collection-bar button {
    font-family: inherit;
    font-size: 0.9rem;
    color: var(--text-faint);
    background: none;
    border: none;
    border-bottom: 1px solid transparent;
    padding: 0.2rem 0;
    cursor: pointer;
    letter-spacing: 0.05em;
    transition: color 0.3s, border-color 0.3s;
  }

  .collection-bar button:hover {
    color: var(--text);
  }

  .collection-bar button.active {
    color: var(--text-strong);
    border-bottom-color: var(--text-strong);
  }

  /* --- Search Box --- */
  .search-box {
    max-width: 640px;
    width: 100%;
    margin-bottom: 1rem;
  }

  .search-box input {
    width: 100%;
    padding: 0.8rem 1.2rem;
    font-family: inherit;
    font-size: 1rem;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 2px;
    outline: none;
    transition: border-color 0.3s;
    letter-spacing: 0.04em;
  }

  .search-box input::placeholder {
    color: var(--text-faint);
    font-style: italic;
  }

  .search-box input:focus {
    border-color: var(--text);
  }

  /* --- Article List --- */
  .article-list {
    max-width: 640px;
    width: 100%;
    list-style: none;
  }

  .article-item {
    padding: 1.8rem 0;
    border-bottom: 1px solid var(--border-light);
  }

  .article-item:first-child {
    padding-top: 0;
  }

  .article-item a {
    text-decoration: none;
    color: var(--text);
    transition: color 0.3s;
    display: block;
  }

  .article-item a:hover .article-title {
    color: var(--hover);
  }

  .article-title {
    font-size: 1.3rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    margin-bottom: 0.5rem;
    line-height: 1.5;
    color: var(--text-strong);
    transition: color 0.3s;
  }

  .article-meta {
    font-size: 0.82rem;
    color: var(--text-faint);
    letter-spacing: 0.04em;
    margin-bottom: 0.6rem;
  }

  .article-collection {
    display: inline-block;
    font-size: 0.75rem;
    color: var(--text-muted);
    border: 1px solid var(--border);
    padding: 0.1em 0.8em;
    border-radius: 1em;
    letter-spacing: 0.08em;
    margin-left: 0.6rem;
    vertical-align: middle;
  }

  .article-excerpt {
    font-size: 0.95rem;
    color: var(--text-muted);
    line-height: 1.8;
    text-align: justify;
  }

  /* --- Empty State --- */
  .empty-state {
    display: none;
    text-align: center;
    color: var(--text-faint);
    font-size: 0.95rem;
    padding: 3rem 0;
    font-style: italic;
  }

  /* --- Footer --- */
  .site-footer {
    margin-top: 4rem;
    text-align: center;
  }

  .back-link {
    font-size: 0.85rem;
    color: var(--text-faint);
    text-decoration: none;
    letter-spacing: 0.05em;
    transition: color 0.3s;
  }

  .back-link:hover {
    color: var(--text);
  }

  .copyright {
    margin-top: 1rem;
    font-size: 0.75rem;
    color: var(--text-faint);
    letter-spacing: 0.03em;
    opacity: 0.7;
  }

  /* --- Responsive --- */
  @media (max-width: 600px) {
    body { padding: 2.5rem 1.2rem 2rem; }
    .site-header h1 { font-size: 1.6rem; }
    .article-title { font-size: 1.15rem; }
    .article-excerpt { font-size: 0.9rem; }
  }
</style>
</head>
<body>

<button class="theme-toggle" id="themeToggle" title="切换黑夜模式"><i class="anzhiyufont anzhiyu-icon-circle-half-stroke"></i></button>

<header class="site-header">
  <h1>地荒的小世界</h1>
  <p class="subtitle">小说 · 随笔 · 创作</p>
</header>

<div class="divider"></div>

<div class="collection-bar" id="collectionBar"></div>

<div class="search-box">
  <input type="text" id="searchInput" placeholder="搜索文章标题、作者或内容…" autocomplete="off">
</div>

<ul class="article-list" id="articleList"></ul>

<div class="empty-state" id="emptyState">未找到相关文章</div>

<footer class="site-footer">
  <a class="back-link" href="/">&larr; 返回首页</a>
  <p class="copyright">© 地荒 · 本站内容均为原创</p>
</footer>

<script src="posts.js"></script>
<script>
(function() {
  var list = document.getElementById('articleList');
  var input = document.getElementById('searchInput');
  var emptyState = document.getElementById('emptyState');
  var collectionBar = document.getElementById('collectionBar');

  var posts = window.POSTS || [];
  var currentCollection = '全部';

  /* --- 黑夜模式 --- */
  (function() {
    var toggle = document.getElementById('themeToggle');
    var html = document.documentElement;
    var saved = localStorage.getItem('dh-blog-theme');
    if (saved) {
      html.setAttribute('data-theme', saved);
    } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
      html.setAttribute('data-theme', 'dark');
    }
    function updateIcon() {
      // anzhiyu 图标本身即半日半月的日夜切换样式，无需替换
    }
    updateIcon();
    toggle.addEventListener('click', function() {
      var next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('dh-blog-theme', next);
      updateIcon();
    });
  })();

  /* --- 合集筛选栏（自动从数据生成） --- */
  function buildCollectionBar() {
    var collections = [];
    posts.forEach(function(p) {
      if (p.collection && collections.indexOf(p.collection) === -1) {
        collections.push(p.collection);
      }
    });
    var html = '<button data-c="全部" class="active">全部</button>';
    collections.forEach(function(c) {
      html += '<button data-c="' + c + '">《' + c + '》</button>';
    });
    collectionBar.innerHTML = html;

    collectionBar.addEventListener('click', function(e) {
      var btn = e.target.closest('button');
      if (!btn) return;
      currentCollection = btn.getAttribute('data-c');
      var btns = collectionBar.querySelectorAll('button');
      btns.forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      render();
    });
  }

  /* --- 渲染列表 --- */
  function render() {
    var keyword = (input.value || '').trim().toLowerCase();
    var html = '';
    var visibleCount = 0;

    posts.forEach(function(post) {
      if (currentCollection !== '全部' && post.collection !== currentCollection) return;

      var haystack = (post.title + ' ' + post.author + ' ' + post.excerpt + ' ' + post.collection).toLowerCase();
      var match = keyword === '' || haystack.indexOf(keyword) !== -1;
      if (!match) return;

      visibleCount++;
      html +=
        '<li class="article-item">' +
          '<a href="reader.html?file=' + encodeURIComponent(post.file) + '">' +
            '<div class="article-title">' + escapeHtml(post.title) +
              (post.collection ? '<span class="article-collection">' + escapeHtml(post.collection) + '</span>' : '') +
            '</div>' +
            '<div class="article-meta">' + escapeHtml(metaText(post)) + '</div>' +
            (post.excerpt ? '<div class="article-excerpt">' + escapeHtml(post.excerpt) + '</div>' : '') +
          '</a>' +
        '</li>';
    });

    list.innerHTML = html;
    emptyState.style.display = (visibleCount === 0) ? 'block' : 'none';
  }

  function metaText(post) {
    var parts = [];
    if (post.author) parts.push(post.author);
    if (post.date) parts.push(post.date);
    return parts.join(' · ');
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  input.addEventListener('input', render);

  buildCollectionBar();
  render();
})();
</script>

</body>
</html>
