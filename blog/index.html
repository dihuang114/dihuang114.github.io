<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>博客 - 地荒资源站</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: #fff;
    color: #2c2c2c;
    font-family: 'Noto Serif SC', 'Source Han Serif SC', '思源宋体', serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 4rem 1.5rem 3rem;
  }

  /* --- Header --- */
  .site-header {
    text-align: center;
    margin-bottom: 4rem;
  }

  .site-header h1 {
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    margin-bottom: 0.6rem;
  }

  .site-header .subtitle {
    font-size: 0.95rem;
    color: #888;
    font-style: italic;
    letter-spacing: 0.08em;
  }

  .divider {
    width: 60px;
    height: 1px;
    background: #ccc;
    margin: 2rem auto;
  }

  /* --- Article List --- */
  .article-list {
    max-width: 640px;
    width: 100%;
    list-style: none;
  }

  .article-item {
    padding: 1.8rem 0;
    border-bottom: 1px solid #eee;
  }

  .article-item:first-child {
    padding-top: 0;
  }

  .article-item a {
    text-decoration: none;
    color: #2c2c2c;
    transition: color 0.3s;
  }

  .article-item a:hover {
    color: #666;
  }

  .article-title {
    font-size: 1.3rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    margin-bottom: 0.5rem;
    line-height: 1.5;
  }

  .article-meta {
    font-size: 0.82rem;
    color: #aaa;
    letter-spacing: 0.04em;
    margin-bottom: 0.6rem;
  }

  .article-excerpt {
    font-size: 0.95rem;
    color: #666;
    line-height: 1.8;
    text-align: justify;
  }

  /* --- Empty State --- */
  .empty-state {
    text-align: center;
    color: #bbb;
    font-size: 0.95rem;
    padding: 3rem 0;
    font-style: italic;
  }

  /* --- Footer --- */
  .site-footer {
    margin-top: 4rem;
    text-align: center;
  }

  .back-link {
    font-size: 0.85rem;
    color: #aaa;
    text-decoration: none;
    letter-spacing: 0.05em;
    transition: color 0.3s;
  }

  .back-link:hover {
    color: #666;
  }

  .copyright {
    margin-top: 1rem;
    font-size: 0.75rem;
    color: #ccc;
    letter-spacing: 0.03em;
  }

  /* --- Responsive --- */
  @media (max-width: 600px) {
    body { padding: 2.5rem 1.2rem 2rem; }
    .site-header h1 { font-size: 1.6rem; }
    .article-title { font-size: 1.15rem; }
    .article-excerpt { font-size: 0.9rem; }
  }
</style>
</head>
<body>

<header class="site-header">
  <h1>地荒文集</h1>
  <p class="subtitle">小说 · 随笔 · 创作</p>
</header>

<div class="divider"></div>

<ul class="article-list">

  <li class="article-item">
    <a href="/blog/jingyesi.html">
      <div class="article-title">静夜思</div>
      <div class="article-meta">李白 · 唐代 &nbsp;|&nbsp; 2025-06-25</div>
      <div class="article-excerpt">床前明月光，疑是地上霜。举头望明月，低头思故乡。</div>
    </a>
  </li>

</ul>

<footer class="site-footer">
  <a class="back-link" href="/">&larr; 返回首页</a>
  <p class="copyright">© 地荒 · 本站内容均为原创</p>
</footer>

</body>
</html>
