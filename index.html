<!DOCTYPE html>
<html lang="zh-CN">

    <meta charset="UTF-8">

    <title>地荒导航页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            min-height: 100vh;
        }

        body {
            display: flex;
            flex-direction: column;
            background: #ffffff;
            color: #333333;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 3rem 1.5rem 2rem;
        }

        /* 头像 */
        .avatar {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid #e5e5e5;
            margin-bottom: 1.5rem;
        }

        /* 社交图标（头像下方，纯图标无文字） */
        .social {
            display: flex;
            gap: 1.2rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 2.5rem;
        }

        .social a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border: 1px solid #d9d9d9;
            border-radius: 50%;
            color: #444444;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .social a:hover {
            border-color: #333333;
            color: #000000;
        }

        .social svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
            stroke: currentColor;
            flex-shrink: 0;
        }

        h1 {
            font-size: 2rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            margin-bottom: 2.5rem;
        }

        nav {
            display: flex;
            gap: 3rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        nav a {
            color: #333333;
            text-decoration: none;
            font-size: 1.1rem;
            position: relative;
            padding-bottom: 4px;
            transition: color 0.3s ease;
        }

        nav a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 1px;
            background: #333333;
            transition: width 0.3s ease;
        }

        nav a:hover::after {
            width: 100%;
        }

        /* 底部信息 */
        .footer {
            text-align: center;
            padding: 1.5rem 1rem 2rem;
            font-size: 0.8rem;
            color: #aaaaaa;
            letter-spacing: 0.05em;
            line-height: 1.8;
        }

        .footer .divider {
            width: 40px;
            height: 1px;
            background: #e0e0e0;
            margin: 0 auto 1rem;
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.5rem;
            }

            nav {
                gap: 2rem;
            }

            nav a {
                font-size: 1rem;
            }

            .social {
                gap: 0.7rem;
            }

            .social a {
                width: 40px;
                height: 40px;
            }

            .social svg {
                width: 20px;
                height: 20px;
            }
        }
    </style>
</head>
