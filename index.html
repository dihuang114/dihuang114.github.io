<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地荒导航页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #ffffff;
            color: #333333;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        .container {
            text-align: center;
            padding: 2rem;
        }

        h1 {
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 3rem;
            letter-spacing: 0.1em;
        }

        nav {
            display: flex;
            gap: 3rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        nav a {
            color: #333333;
            text-decoration: none;
            font-size: 1.1rem;
            position: relative;
            padding-bottom: 4px;
            transition: color 0.3s ease;
        }

        nav a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 1px;
            background: #333333;
            transition: width 0.3s ease;
        }

        nav a:hover::after {
            width: 100%;
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.5rem;
            }

            nav {
                gap: 2rem;
            }

            nav a {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>地荒导航页</h1>
        <nav>
            <a href="/res/">资源</a>
            <a href="/tool/">游乐场</a>
            <a href="/blog/">地荒博客</a>
        </nav>
    </div>
</body>
</html>
