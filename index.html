<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地荒导航页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #ffffff;
            color: #333333;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        .container {
            text-align: center;
            padding: 2rem;
        }

        /* 头像 */
        .avatar {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid #e5e5e5;
            margin-bottom: 1.5rem;
        }

        h1 {
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 3rem;
            letter-spacing: 0.1em;
        }

        nav {
            display: flex;
            gap: 3rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        nav a {
            color: #333333;
            text-decoration: none;
            font-size: 1.1rem;
            position: relative;
            padding-bottom: 4px;
            transition: color 0.3s ease;
        }

        nav a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 1px;
            background: #333333;
            transition: width 0.3s ease;
        }

        nav a:hover::after {
            width: 100%;
        }

        /* 社交按钮 */
        .social {
            margin-top: 3rem;
            display: flex;
            gap: 1.5rem;
            justify-content: center;
        }

        .social a {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.45rem 1.1rem;
            border: 1px solid #d9d9d9;
            border-radius: 2rem;
            color: #444444;
            text-decoration: none;
            font-size: 0.9rem;
            letter-spacing: 0.04em;
            transition: all 0.3s ease;
        }

        .social a:hover {
            border-color: #333333;
            color: #000000;
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.5rem;
            }

            nav {
                gap: 2rem;
            }

            nav a {
                font-size: 1rem;
            }

            .social {
                gap: 0.8rem;
                flex-wrap: wrap;
            }

            .social a {
                padding: 0.4rem 0.9rem;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <img class="avatar" src="/img/avatar.jpg" alt="地荒">
        <h1>地荒导航页</h1>
        <nav>
            <a href="/res/">资源站</a>
            <a href="/tool/">游乐场</a>
            <a href="/blog/">地荒博客</a>
        </nav>
        <div class="social">
            <a href="https://github.com/dihuang114" target="_blank" rel="noopener">
                GitHub
            </a>
            <a href="https://space.bilibili.com/488304519" target="_blank" rel="noopener">
                BiliBili
            </a>
            <a href="https://ifdian.net/a/dihuang114" target="_blank" rel="noopener">
                爱发电
            </a>
        </div>
    </div>
</body>
</html>
