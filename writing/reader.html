<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>地荒的小世界</title>
<style>
  /* 字体为系统本地字体，无需等待 */
  html.fonts-ready body {
    visibility: visible;
  }

  :root {
    --bg: #ffffff;
    --text: #1a1a1a;          /* 正文（加重） */
    --text-strong: #000000;   /* 标题（最重） */
    --text-muted: #444444;    /* 次要文字 */
    --text-faint: #888888;    /* 元信息 */
    --border: #e0e0e0;
    --border-light: #eeeeee;
    --code-bg: #f5f5f5;
    --code-border: #e8e8e8;
    --hover: #444444;
  }

  [data-theme="dark"] {
    --bg: #1a1a1a;
    --text: #d4d4d4;
    --text-strong: #f0f0f0;
    --text-muted: #b0b0b0;
    --text-faint: #8a8a8a;
    --border: #3a3a3a;
    --border-light: #2e2e2e;
    --code-bg: #242424;
    --code-border: #333333;
    --hover: #aaaaaa;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: "Noto Serif SC", "Source Han Serif SC", "思源宋体", "Songti SC", SimSun, serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 4rem 1.5rem 3rem;
    transition: background 0.3s, color 0.3s;
  }

  /* --- Article Container --- */
  .article {
    max-width: 640px;
    width: 100%;
  }

  /* --- Title --- */
  .article-header {
    text-align: center;
    margin-bottom: 2rem;
  }

  .article-header h1 {
    font-size: 1.8rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    margin-bottom: 0.8rem;
    line-height: 1.4;
    color: var(--text-strong);
  }

  .article-meta {
    font-size: 0.85rem;
    color: var(--text-faint);
    letter-spacing: 0.05em;
  }

  .article-collection {
    display: inline-block;
    margin-top: 0.8rem;
    font-size: 0.8rem;
    color: var(--text-muted);
    border: 1px solid var(--border);
    padding: 0.15em 1em;
    border-radius: 1em;
    letter-spacing: 0.1em;
  }

  .divider {
    width: 40px;
    height: 1px;
    background: var(--border);
    margin: 2rem auto;
  }

  /* --- 阅读统计（字数 + 阅读时间） --- */
  .article-stats {
    margin-top: 0.5rem;
    font-size: 0.8rem;
    color: var(--text-faint);
    letter-spacing: 0.05em;
  }

  /* --- 目录导航 --- */
  .toc {
    max-width: 640px;
    width: 100%;
    margin: 0 auto 2.5rem;
    padding: 1.2rem 1.5rem;
    border: 1px solid var(--border-light);
    border-radius: 4px;
    background: var(--bg);
  }

  .toc-title {
    text-align: center;
    font-size: 0.85rem;
    color: var(--text-muted);
    letter-spacing: 0.15em;
    margin-bottom: 0.8rem;
  }

  .toc ul {
    list-style: none;
    padding: 0;
    margin: 0;
  }

  .toc li {
    margin: 0.3rem 0;
    line-height: 1.7;
  }

  .toc li.h3 {
    padding-left: 1.2em;
  }

  .toc a {
    color: var(--text);
    text-decoration: none;
    font-size: 0.9rem;
    letter-spacing: 0.03em;
    border-bottom: 1px solid transparent;
    transition: border-color 0.3s, color 0.3s;
  }

  .toc a:hover {
    color: var(--hover);
    border-bottom-color: var(--hover);
  }

  /* --- Content Typography --- */
  .article-body {
    font-size: var(--reader-font-size, 20px);
    line-height: 2;
    color: var(--text);
    text-align: justify;
  }

  .article-body p {
    margin-bottom: 1.5em;
    text-indent: 2em;
  }

  .article-body h1,
  .article-body h2,
  .article-body h3,
  .article-body h4 {
    font-weight: 700;
    text-align: center;
    margin: 2.5em 0 1.2em;
    letter-spacing: 0.08em;
    line-height: 1.5;
    color: var(--text-strong);
  }

  .article-body h1 { font-size: 1.5rem; }
  .article-body h2 { font-size: 1.3rem; }
  .article-body h3 { font-size: 1.1rem; }

  /* 引用/题记 */
  .article-body blockquote {
    text-align: center;
    font-style: italic;
    color: var(--text-muted);
    margin: 1.5em 0 2.5em;
    font-size: 0.95rem;
    border: none;
  }

  .article-body blockquote p {
    text-indent: 0;
    margin-bottom: 0.5em;
  }

  /* 分隔线 */
  .article-body hr {
    border: none;
    text-align: center;
    margin: 3em 0;
  }

  .article-body hr::after {
    content: '* * *';
    letter-spacing: 1em;
    color: var(--text-faint);
    font-size: 0.9rem;
  }

  /* 列表 */
  .article-body ul,
  .article-body ol {
    margin: 1.5em 0;
    padding-left: 2.5em;
  }

  .article-body li {
    margin-bottom: 0.6em;
  }

  /* 链接 */
  .article-body a {
    color: var(--text-strong);
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  .article-body a:hover {
    color: var(--hover);
  }

  /* 代码 */
  .article-body code {
    font-family: "Consolas", "Menlo", monospace;
    font-size: 0.9em;
    background: var(--code-bg);
    padding: 0.15em 0.4em;
  }

  .article-body pre {
    background: var(--code-bg);
    border: 1px solid var(--code-border);
    padding: 1em 1.2em;
    margin: 1.5em 0;
    overflow-x: auto;
    font-size: 0.9em;
    line-height: 1.6;
  }

  .article-body pre code {
    background: none;
    padding: 0;
  }

  /* --- Loading / Error --- */
  .status {
    text-align: center;
    color: var(--text-faint);
    font-size: 0.95rem;
    padding: 3rem 0;
    font-style: italic;
  }

  /* --- Navigation --- */
  .article-nav {
    display: flex;
    justify-content: space-between;
    margin-top: 4rem;
    padding-top: 2rem;
    border-top: 1px solid var(--border-light);
  }

  .article-nav a {
    font-size: 0.85rem;
    color: var(--text-faint);
    text-decoration: none;
    letter-spacing: 0.04em;
    transition: color 0.3s;
  }

  .article-nav a:hover {
    color: var(--text);
  }

  /* --- Footer --- */
  .site-footer {
    margin-top: 3rem;
    text-align: center;
  }

  .copyright {
    font-size: 0.75rem;
    color: var(--text-faint);
    letter-spacing: 0.03em;
    opacity: 0.7;
  }

  /* --- Responsive --- */
  @media (max-width: 600px) {
    body { padding: 2.5rem 1.2rem 2rem; }
    .article-header h1 { font-size: 1.5rem; }
    .article-body { font-size: var(--reader-font-size, 20px); }
  }

  /* --- 顶部工具栏（焊死在文章顶部） --- */
  .toolbar {
    position: sticky;
    top: 0;
    z-index: 100;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 0.8rem;
    padding: 0.6rem 1rem;
    background: var(--bg);
    border-bottom: 1px solid var(--border-light);
    margin-bottom: 2.5rem;
    transition: background 0.3s, border-color 0.3s;
  }

  .toolbar button {
    background: none;
    border: 1px solid var(--border);
    color: var(--text);
    width: 38px;
    height: 38px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s;
    font-family: inherit;
  }

  .toolbar button:hover {
    border-color: var(--text);
  }

  .toolbar svg {
    width: 18px;
    height: 18px;
    fill: currentColor;
    stroke: currentColor;
  }

  /* 字号调节弹出面板 */
  .font-size-pop {
    position: absolute;
    top: calc(100% + 8px);
    left: 50%;
    transform: translateX(-50%);
    display: none;
    align-items: center;
    gap: 0.4rem;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 2rem;
    padding: 0.3rem 0.6rem;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
    white-space: nowrap;
    z-index: 101;
  }

  .font-size-pop.show {
    display: flex;
  }

  .font-size-pop button {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    font-size: 1rem;
    font-weight: 700;
  }
</style>
</head>
<body>

<div class="toolbar">
  <button id="themeToggle" title="切换黑夜模式" aria-label="切换黑夜模式">
    <svg id="iconMoon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    <svg id="iconSun" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="display:none;"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
  </button>
  <div style="position:relative;">
    <button id="fontSizeBtn" title="调节文字大小" aria-label="调节文字大小">A</button>
    <div class="font-size-pop" id="fontSizePop">
      <button id="fontDec" title="减小字号" aria-label="减小字号">−</button>
      <button id="fontInc" title="增大字号" aria-label="增大字号">+</button>
    </div>
  </div>
</div>

<article class="article">

  <header class="article-header" id="articleHeader" style="display:none;">
    <h1 id="articleTitle"></h1>
    <p class="article-meta" id="articleMeta"></p>
    <p class="article-stats" id="articleStats"></p>
    <p class="article-collection" id="articleCollection" style="display:none;"></p>
  </header>

  <div class="divider" id="articleDivider" style="display:none;"></div>

  <nav class="toc" id="articleToc" style="display:none;"></nav>

  <div class="article-body" id="articleBody">
    <p class="status">加载中…</p>
  </div>

  <nav class="article-nav">
    <a href="/writing/">&larr; 返回目录</a>
  </nav>

</article>

<footer class="site-footer">
  <p class="copyright">© 地荒 · 本站内容均为原创</p>
</footer>

<script src="/writing/marked.min.js"></script>
<script src="/writing/posts.js"></script>
<script>
(function() {
  /* --- 字体为系统本地字体，无需等待，直接显示 --- */
  (function() {
    document.documentElement.classList.add('fonts-ready');
  })();

  /* --- 黑夜/白天模式切换（按钮焊死在顶部工具栏） --- */
  (function() {
    var toggle = document.getElementById('themeToggle');
    var html = document.documentElement;
    var saved = localStorage.getItem('dh-blog-theme');
    if (saved) {
      html.setAttribute('data-theme', saved);
    } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
      html.setAttribute('data-theme', 'dark');
    }
    updateThemeIcon();
    toggle.addEventListener('click', function() {
      var next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('dh-blog-theme', next);
      updateThemeIcon();
    });
  })();

  function updateThemeIcon() {
    var dark = document.documentElement.getAttribute('data-theme') === 'dark';
    document.getElementById('iconMoon').style.display = dark ? 'none' : '';
    document.getElementById('iconSun').style.display = dark ? '' : 'none';
  }

  /* --- 字号调节（弹出 + / -） --- */
  (function() {
    var btn = document.getElementById('fontSizeBtn');
    var pop = document.getElementById('fontSizePop');
    var inc = document.getElementById('fontInc');
    var dec = document.getElementById('fontDec');
    var articleBody = document.getElementById('articleBody');

    // 字号范围 14px ~ 26px，默认 18px
    var MIN = 14, MAX = 26, DEFAULT = 20;
    var current = parseInt(localStorage.getItem('dh-font-size'), 10) || DEFAULT;
    if (current < MIN) current = MIN;
    if (current > MAX) current = MAX;
    applyFontSize(current);

    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      pop.classList.toggle('show');
    });

    inc.addEventListener('click', function(e) {
      e.stopPropagation();
      if (current < MAX) { current++; applyFontSize(current); }
    });

    dec.addEventListener('click', function(e) {
      e.stopPropagation();
      if (current > MIN) { current--; applyFontSize(current); }
    });

    document.addEventListener('click', function() {
      pop.classList.remove('show');
    });

    function applyFontSize(size) {
      current = size;
      localStorage.setItem('dh-font-size', String(size));
      articleBody.style.fontSize = size + 'px';
    }
  })();

  /* --- 解析 URL 参数 ?file=xxx.md --- */
  var params = new URLSearchParams(window.location.search);
  var file = params.get('file');

  var body = document.getElementById('articleBody');
  var header = document.getElementById('articleHeader');
  var divider = document.getElementById('articleDivider');

  if (!file || !/\.md$/i.test(file)) {
    body.innerHTML = '<p class="status">文章不存在</p>';
    return;
  }

  /* 从 window.POSTS 中查找文章（内容已由 build-posts.js 嵌入，无需 fetch） */
  var fileName = file.replace(/^.*[\\\/]/, '');
  var post = null;
  (window.POSTS || []).forEach(function(p) {
    if (p.file === fileName) post = p;
  });

  if (!post || !post.content) {
    body.innerHTML = '<p class="status">文章加载失败（未找到文章数据，请重新部署）</p>';
    return;
  }

  var title = post.title || '';
  var meta = '';
  if (post.author) meta = post.author;
  var collection = post.collection || '';
  var content = post.content;

  // 渲染 markdown
  var html = marked.parse(content);
  body.innerHTML = html;

  // 未指定 title 时，从正文第一个 h1 提取
  if (!title) {
    var h1 = body.querySelector('h1');
    if (h1) title = h1.textContent.trim();
  }

  // 删除正文中重复的标题 h1（若 front-matter 已提供 title）
  var h1s = body.querySelectorAll('h1');
  h1s.forEach(function(h) {
    if (title && h.textContent.trim() === title) h.remove();
  });

  if (title) {
    document.title = title + ' - 地荒的小世界';
    document.getElementById('articleTitle').textContent = title;
    document.getElementById('articleMeta').textContent = meta;

    // 字数与阅读时间估算（约 400 字/分钟）
    var wordCount = post.wordCount || body.textContent.replace(/\s+/g, '').length;
    var minutes = Math.max(1, Math.ceil(wordCount / 400));
    document.getElementById('articleStats').textContent = wordCount + ' 字 · 约 ' + minutes + ' 分钟';

    if (collection) {
      var cEl = document.getElementById('articleCollection');
      cEl.textContent = '《' + collection + '》';
      cEl.style.display = '';
    }
    header.style.display = '';
    divider.style.display = '';
  }

  /* --- 生成目录导航（按 md 的 h2/h3 层级） --- */
  (function() {
    var toc = document.getElementById('articleToc');
    var headings = body.querySelectorAll('h2, h3');
    if (headings.length === 0) return;

    var html = '<div class="toc-title">目 录</div><ul>';
    headings.forEach(function(h, i) {
      var id = 'toc-sec-' + i;
      h.id = id;
      html += '<li class="' + h.tagName.toLowerCase() + '"><a href="#' + id + '">' +
        escapeHtml(h.textContent.trim()) + '</a></li>';
    });
    html += '</ul>';
    toc.innerHTML = html;
    toc.style.display = '';

    // 平滑滚动到章节
    toc.addEventListener('click', function(e) {
      var a = e.target.closest('a');
      if (!a) return;
      e.preventDefault();
      var target = document.getElementById(a.getAttribute('href').slice(1));
      if (target) {
        var top = target.getBoundingClientRect().top + window.pageYOffset - 80;
        window.scrollTo({ top: top, behavior: 'smooth' });
      }
    });
  })();

  /* --- 自动保存 / 恢复阅读位置 --- */
  (function() {
    var POS_KEY = 'dh-read-pos-' + fileName;
    var savedPos = parseInt(localStorage.getItem(POS_KEY), 10);
    if (savedPos > 0) {
      setTimeout(function() {
        window.scrollTo(0, savedPos);
      }, 50);
    }
    var ticking = false;
    window.addEventListener('scroll', function() {
      if (!ticking) {
        window.requestAnimationFrame(function() {
          localStorage.setItem(POS_KEY, String(window.pageYOffset));
          ticking = false;
        });
        ticking = true;
      }
    });
  })();

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
})();
</script>

</body>
</html>
