<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>棋匠 · 地荒象棋</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root { --bg:#241d15; --panel:#362a1c; --panel-line:#5d4a2f; --text:#efe3c8; --dim:#b9a884; --accent:#e8b64c; --dark:#241b12; }
html, body { height: 100%; }
body { min-height: 100vh; background: radial-gradient(1200px 700px at 50% 0%, #3a2f20, var(--bg)); color: var(--text); font-family: "Microsoft YaHei", "PingFang SC", sans-serif; font-size: 14px; line-height: 1.6; }
header.topbar { position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px 28px; padding: 14px 24px; background: rgba(0,0,0,.25); border-bottom: 1px solid var(--panel-line); }
header.topbar h1 { font-size: 22px; letter-spacing: 2px; } header.topbar h1 small { font-size: 12px; color: var(--dim); font-weight: 400; margin-left: 8px; }
.ctl { font-size: 13px; color: var(--dim); display: inline-flex; align-items: center; gap: 6px; }
select, button, input[type=number] { background: var(--dark); color: var(--text); border: 1px solid var(--panel-line); border-radius: 8px; padding: 7px 12px; font-size: 13px; font-family: inherit; outline: none; cursor: pointer; }
button:hover, select:hover { border-color: var(--accent); } button:active { transform: translateY(1px); } button:disabled { opacity: .45; cursor: not-allowed; }
.rulesDesc { max-width: 960px; margin: 14px auto 0; width: calc(100% - 40px); background: var(--panel); border: 1px solid var(--panel-line); border-left: 4px solid var(--accent); border-radius: 10px; padding: 12px 16px; font-size: 13.5px; color: var(--dim); }
main.layout { display: flex; gap: 26px; justify-content: center; align-items: flex-start; padding: 22px 20px 30px; flex-wrap: wrap; }
#boardArea { display: flex; flex-direction: column; align-items: center; gap: 10px; }
#board { position: relative; container-type: inline-size; width: min(86vmin, 640px); aspect-ratio: 940 / 1024; border-radius: 10px; box-shadow: 0 18px 50px rgba(0,0,0,.55), 0 4px 12px rgba(0,0,0,.4); user-select: none; -webkit-user-select: none; cursor: pointer; }
#board.flipped { transform: rotate(180deg); }
#boardSvg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#marks, #pieces { position: absolute; inset: 0; pointer-events: none; }
.piece { position: absolute; transform: translate(-50%,-50%) rotate(var(--rot, 0deg)); width: calc(8.6cqw / var(--scale)); aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: radial-gradient(circle at 36% 30%, #fdf4dd, #efd3a0 55%, #dbb678); border: calc(0.38cqw / var(--scale)) solid #6b4423; box-shadow: 0 calc(0.7cqw / var(--scale)) calc(1.1cqw / var(--scale)) rgba(0,0,0,.38), inset 0 0 0 calc(0.4cqw / var(--scale)) rgba(139,90,43,.28); font-family: "KaiTi","STKaiti","SimSun",serif; font-weight: 700; font-size: calc(5.55cqw / var(--scale)); line-height: 1; }
.piece.red { color: #b3202a; } .piece.black { color: #17130d; }
.piece.selected { box-shadow: 0 0 0 calc(0.55cqw / var(--scale)) rgba(232,182,76,.95), 0 calc(0.7cqw / var(--scale)) calc(1.4cqw / var(--scale)) rgba(0,0,0,.45); }
.piece.check { animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 calc(0.45cqw / var(--scale)) rgba(214,60,60,.85); } 50% { box-shadow: 0 0 0 calc(1.5cqw / var(--scale)) rgba(214,60,60,0); } }
.mark { position: absolute; transform: translate(-50%,-50%); border-radius: 50%; pointer-events: none; }
.mark.last { width: calc(9.6cqw / var(--scale)); aspect-ratio: 1; background: rgba(255,214,90,.38); }
.mark.move { width: calc(3.4cqw / var(--scale)); aspect-ratio: 1; background: rgba(34,118,58,.6); }
.mark.capture { width: calc(8.6cqw / var(--scale)); aspect-ratio: 1; border: calc(0.6cqw / var(--scale)) solid rgba(204,60,50,.85); background: rgba(204,60,50,.18); }
.clocks { display: flex; gap: 14px; justify-content: center; margin: 4px 0 6px; font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
.clocks .clk { padding: 1px 10px; border-radius: 6px; background: rgba(0,0,0,.18); color: var(--dim); } .clocks .clk.active { color: #fff; background: var(--accent); } .clocks .clk.low { color: #ff8d80; }
#side { width: 330px; max-width: 94vw; display: flex; flex-direction: column; gap: 14px; max-height: calc(100vh - 120px); overflow-y: auto; }
.panel { background: var(--panel); border: 1px solid var(--panel-line); border-radius: 12px; padding: 14px 16px; }
.status { font-size: 16px; font-weight: 700; padding: 11px 14px; border-radius: 10px; background: var(--dark); border: 1px solid var(--panel-line); border-left: 4px solid #8a6d45; }
.status.check { border-left-color: #d64a4a; } .status.win-red { border-left-color: #c62828; color: #ff8d80; } .status.win-black { border-left-color: #d6d6d6; color: #e8e8e8; } .status.draw, .status.think { border-left-color: var(--accent); } .status.pause { border-left-color: #6fa3d8; color: #cfe4ff; }
.captures { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 8px; font-size: 13px; color: var(--dim); } .captures b { font-weight: 400; margin-right: 4px; } .captures .items { color: var(--text); letter-spacing: 2px; min-height: 1.2em; word-break: break-all; }
#moveLog { max-height: 150px; overflow-y: auto; font-size: 13px; line-height: 1.7; background: #1d160e; border-radius: 8px; padding: 8px 10px; font-family: Consolas, monospace; } #moveLog div:nth-child(odd) { background: rgba(255,255,255,.03); } #moveLog .rd { color: #ff9d92; } #moveLog .bd { color: #e6e6e6; } #moveLog .num { color: #8a7a58; margin-right: 6px; }
.hint { font-size: 13px; color: var(--dim); }
@media (max-width: 940px) { main.layout { flex-direction: column; align-items: center; } #board { width: min(92vmin, 560px); } }
</style>
</head>
<body>
<header class="topbar">
  <h1>棋匠 · 地荒象棋<small></small></h1>
  <label class="ctl">模式 <select id="mode"><option value="pvp" selected>本地对战</option><option value="ai">人机对战</option><option value="watch">AI对战</option></select></label>
  <label class="ctl">AI 深度 <select id="diff"><option value="1">1</option><option value="2">2</option><option value="3" selected>3</option><option value="4">4</option><option value="5">5</option></select></label>
  <label class="ctl">风格 <select id="aiStyle"><option value="balanced" selected>平衡</option><option value="solid">稳健</option><option value="random">随机</option></select></label>
  <label class="ctl">引擎 <select id="aiEngine"><option value="js" selected>JS AI</option><option value="fsf">Fairy-Stockfish</option></select></label>
  <label class="ctl">视角 <select id="flipMenu"><option value="red" selected>我执红</option><option value="black">我执黑</option></select></label>
  <label class="ctl"><input type="checkbox" id="chkFlipSide"> 翻转</label>
  <button id="btnPause">暂停</button>
  <button id="btnHint" style="display:none">AI 提示</button>
  <button id="btnNew">新对局</button>
  <button id="btnUndo">悔棋</button>
</header>
<div class="rulesDesc">三条特殊规则(其余同传统象棋):<br>1.象(相)可过河，仍走”田”字，被塞象眼不能走。<br>2.兵(卒)过河前可前进、横走,过河后前进、横走、后退均可。<br>3.盾不可被吃,不可吃子;可横走、前进;不能过河</div>
<main class="layout">
  <section id="boardArea">
    <div id="board"><svg id="boardSvg" viewBox="-70 -62 940 1024" preserveAspectRatio="xMidYMid meet"></svg><div id="marks"></div><div id="pieces"></div></div>
    <p class="hint">规则改动即时生效；人机模式你执红方</p>
  </section>
  <aside id="side">
    <div class="panel"><div id="status" class="status">红方走棋</div>
    <div id="clocks" class="clocks" style="display:none"><span class="clk red" id="clkRed">--:--</span><span class="clk black" id="clkBlack">--:--</span></div>
    <div class="captures"><span><b>红方吃掉</b><span class="items" id="capRed">—</span></span><span><b>黑方吃掉</b><span class="items" id="capBlack">—</span></span></div>
    <div id="moveLog"></div></div>
  </aside>
</main>
<script>

// ===ENGINE-START=== 引擎（纯逻辑，无 DOM 依赖，配置全部由 RULES 驱动）
'use strict';
var RED = 0, BLACK = 1;
var K='k', A='a', E='e', H='h', R='r', C='c', P='p', D='d';
var ORTH  = [[1,0],[-1,0],[0,1],[0,-1]];
var DIAG  = [[1,1],[1,-1],[-1,1],[-1,-1]];
var KNIGHT= [[1,2],[1,-2],[-1,2],[-1,-2],[2,1],[2,-1],[-2,1],[-2,-1]];
// 方向为"己方视角"：u=向敌前进，d=向己后退；引擎按红黑自动镜像（黑方 u 是行号增大方向）
var DIRV = { u:[-1,0], d:[1,0], l:[0,-1], r:[0,1], ul:[-1,-1], ur:[-1,1], dl:[1,-1], dr:[1,1] };
function dirVec(side, name) {
  var v = DIRV[name];
  if (side === BLACK) return [v[0] === 0 ? 0 : -v[0], v[1]];
  return v;
}
var COLS = '一二三四五六七八九';
// 列/步数记号：1..9 用中文数字，超过 9（自定义大棋盘）用阿拉伯数字
function fileLabel(n) { return n <= 9 ? COLS[n - 1] : String(n); }
var MATE = 100000;
var ERR_TIMEOUT = { name: 'Timeout' };
var PLIES = 0;                       // 本局已行半着数（冷却/开局锁定用）
function setPlies(n) { PLIES = n | 0; }

// 走法模式 PAT = { style:'line'|'knight'|'tian'|'mu', dirs:[方向名], dist:1|2|'slide', block:bool(阻断/蹩腿/象眼), screen:bool(炮架) }
// 每个棋子的移动走法与吃子走法互相独立，且过河前( moveB/capB )与过河后( moveA/capA )各有一套
// diffPhase: 过河前后规则是否不同（false 时 moveA=moveB, capA=capB）
// diffCap: 移动与吃子规则是否不同（false 时 capB=moveB, capA=moveA）
// 方向为"己方视角"：u=向敌前进，d=向己后退；引擎按红黑自动镜像
function PAT(style, dirs, dist, block, screen, jump, blockOffsets, stayCapture, fill, firstN, land, hop, afterN) {
  // jump: 越子/隔子数（移动=最多越过 n 子；吃子=恰好隔 n 子）；screen 为旧字段（true→jump=1）
  // fill: 走 x 格时可在 1..x 任意步落子；firstN: 仅前 firstN 步可用（0=始终）；afterN: 仅第 afterN 步之后可用（0=始终）
  // land: 落点距离（>0 时越过第 n 个子后只能落在其前方 land 格，0=不限距离继续滑行）
  // hop: 跳吃/越落（跳棋式）——越过第 1 个遇到的子，只落在其旁 land 格；吃子=吃掉被越的子
  var jp = (jump !== undefined) ? Math.max(0, Math.min(3, jump | 0)) : (screen ? 1 : 0);
  return { style: style, dirs: dirs, dist: dist, block: !!block, screen: jp > 0, jump: jp,
           blockOffsets: blockOffsets || [], stayCapture: !!stayCapture, fill: !!fill,
           firstN: Math.max(0, Math.min(20, firstN | 0)),
           land: Math.max(0, Math.min(9, land | 0)),
           hop: !!hop,
           afterN: Math.max(0, Math.min(20, afterN | 0)) };
}
var ORTH4 = ['u','d','l','r'], DIAG4 = ['ul','ur','dl','dr'];
function PL(style, dirs, dist, block, screen) { return [PAT(style, dirs, dist, block, screen)]; }   // 单走法列表
function patsOf(x) { return Array.isArray(x) ? x : (x ? [x] : []); }
var MU_OFFSETS = [[2,3],[2,-3],[-2,3],[-2,-3],[3,2],[3,-2],[-3,2],[-3,-2]];   // 大目字跳 2×3
var MU2_OFFSETS = [[1,3],[1,-3],[-1,3],[-1,-3],[3,1],[3,-1],[-3,1],[-3,-1]];   // 小目字跳 1×3

function defaultPieces() {
  return {
    k: { name: '帅/将', value: 10000, inherit: '将帅：四向一步，默认限九宫',
         moveB: PL('line', ORTH4, 1), capB: PL('line', ORTH4, 1),
         moveA: PL('line', ORTH4, 1), capA: PL('line', ORTH4, 1),
         canCrossRiver: true, canEnterPalace: true, canLeavePalace: false, cooldown: 0, lock: 0, capturableB: true, capturableA: true, canCaptureB: true, canCaptureA: true, stayCrossed: false, chainCapture: false, diffPhase: false, diffCap: false, diffFirst: false, moveF: [], capF: [], transform: defTransform(), diffSides: false, cfgBlack: null, diffSides: false, cfgBlack: null },
    a: { name: '仕/士', value: 220, inherit: '士：斜向一步，默认限九宫',
         moveB: PL('line', DIAG4, 1), capB: PL('line', DIAG4, 1),
         moveA: PL('line', DIAG4, 1), capA: PL('line', DIAG4, 1),
         canCrossRiver: true, canEnterPalace: true, canLeavePalace: false, cooldown: 0, lock: 0, capturableB: true, capturableA: true, canCaptureB: true, canCaptureA: true, stayCrossed: false, chainCapture: false, diffPhase: false, diffCap: false, diffFirst: false, moveF: [], capF: [], transform: defTransform(), diffSides: false, cfgBlack: null, diffSides: false, cfgBlack: null },
    e: { name: '相/象', value: 220, inherit: '象：田字跳，塞象眼，默认限本方半场、不入对方九宫',
         moveB: PL('tian', null, 2, true), capB: PL('tian', null, 2, true),
         moveA: PL('tian', null, 2, true), capA: PL('tian', null, 2, true),
         canCrossRiver: false, canEnterPalace: false, canLeavePalace: true, cooldown: 0, lock: 0, capturableB: true, capturableA: true, canCaptureB: true, canCaptureA: true, stayCrossed: false, chainCapture: false, diffPhase: false, diffCap: false, diffFirst: false, moveF: [], capF: [], transform: defTransform(), diffSides: false, cfgBlack: null, diffSides: false, cfgBlack: null },
    h: { name: '马', value: 450, inherit: '马：日字跳，默认蹩马腿',
         moveB: PL('knight', null, 1, true), capB: PL('knight', null, 1, true),
         moveA: PL('knight', null, 1, true), capA: PL('knight', null, 1, true),
         canCrossRiver: true, canEnterPalace: true, canLeavePalace: true, cooldown: 0, lock: 0, capturableB: true, capturableA: true, canCaptureB: true, canCaptureA: true, stayCrossed: false, chainCapture: false, diffPhase: false, diffCap: false, diffFirst: false, moveF: [], capF: [], transform: defTransform(), diffSides: false, cfgBlack: null, diffSides: false, cfgBlack: null },
    r: { name: '车', value: 950, inherit: '车：横竖直线滑行',
         moveB: PL('line', ORTH4, 'slide'), capB: PL('line', ORTH4, 'slide'),
         moveA: PL('line', ORTH4, 'slide'), capA: PL('line', ORTH4, 'slide'),
         canCrossRiver: true, canEnterPalace: true, canLeavePalace: true, cooldown: 0, lock: 0, capturableB: true, capturableA: true, canCaptureB: true, canCaptureA: true, stayCrossed: false, chainCapture: false, diffPhase: false, diffCap: false, diffFirst: false, moveF: [], capF: [], transform: defTransform(), diffSides: false, cfgBlack: null, diffSides: false, cfgBlack: null },
    c: { name: '炮', value: 500, inherit: '炮：直线滑行，吃子须隔一子',
         moveB: PL('line', ORTH4, 'slide'), capB: PL('line', ORTH4, 'slide', false, true),
         moveA: PL('line', ORTH4, 'slide'), capA: PL('line', ORTH4, 'slide', false, true),
         canCrossRiver: true, canEnterPalace: true, canLeavePalace: true, cooldown: 0, lock: 0, capturableB: true, capturableA: true, canCaptureB: true, canCaptureA: true, stayCrossed: false, chainCapture: false, diffPhase: false, diffCap: true, diffFirst: false, moveF: [], capF: [], transform: defTransform(), diffSides: false, cfgBlack: null, diffSides: false, cfgBlack: null },
    p: { name: '兵/卒', value: 110, inherit: '兵：过河前仅前进；过河后前进+横走',
         moveB: PL('line', ['u'], 1), capB: PL('line', ['u'], 1),
         moveA: PL('line', ['u','l','r'], 1), capA: PL('line', ['u','l','r'], 1),
         canCrossRiver: true, canEnterPalace: true, canLeavePalace: true, cooldown: 0, lock: 0, capturableB: true, capturableA: true, canCaptureB: true, canCaptureA: true, stayCrossed: true, chainCapture: false, diffPhase: true, diffCap: false, diffFirst: false, moveF: [], capF: [], transform: defTransform(), diffSides: false, cfgBlack: null }
  };
  // 注意：盾不再是内置棋子——仅地荒预设以"自定义棋子"形式提供
}

var DEFAULT_RULES = {
  name: '我的变体',
  pieces: defaultPieces(),
  custom: [],          // 自定义棋子：{ id:'c1'.., name, value, inherit, 四个 PAT, 区域/冷却/锁定 }
  disabled: [],        // 被删除的内置棋子（将帅不可删）
  global: { stalemateIsLoss: true, repetitionIsDraw: true, perpetualCheckIsLoss: true,
            chaseIsLoss: true, noCaptureDraw: true, noCaptureLimit: 120, basicDraw: true, maxMoves: 400, flyingGeneral: true,
            mustCapture: false, captureWin: false, timeMinutes: 0 },
  // 棋盘：rows/cols=行/列数（5..26）；riverRow=河带位于第 N 与 N+1 行之间（红方 r<=N 过河，黑方 r>=N+1 过河）
  // palaceRows/palaceCols=九宫大小（默认 3×3，自动居中：红底 N 行 / 黑顶 N 行，列居中）
  board: { rows: 10, cols: 9, riverRow: 4, palaceRows: 3, palaceCols: 3 },
  setup: { custom: false, red: {}, black: {} }   // 开局摆子；custom=false 用标准摆法
};
var RULES = JSON.parse(JSON.stringify(DEFAULT_RULES));

// 规则注入：自对弈/独立版经 new Function 提取引擎后，必须用 applyRules 注入（直接赋 RULES 无效，闭包内不变）
function applyRules(r) { RULES = r || RULES; return RULES; }

function isCustomType(t) { return t.length > 1 && t.charAt(0) === 'c'; }
function pieceCfg(t, s) {
  if (RULES.disabled.indexOf(t) >= 0) return null;           // 被删除的棋子
  var cfg = null;
  if (RULES.pieces[t]) cfg = RULES.pieces[t];
  else for (var i = 0; i < RULES.custom.length; i++) if (RULES.custom[i].id === t) cfg = RULES.custom[i];
  if (!cfg) return null;
  // 红黑规则不同是每棋子独立开关：黑方走该棋子的 cfgBlack
  if (s === BLACK && cfg.diffSides && cfg.cfgBlack) return cfg.cfgBlack;
  return cfg;
}
function pieceName(t, s) {
  var cfg = pieceCfg(t, s);
  if (!cfg) {
    var d = DEFAULT_RULES.pieces[t];                          // 已删除的内置棋子仍显示名称
    if (d) return d.name.split('/')[s === RED ? 0 : 1];
    return '?';
  }
  if (cfg.name.indexOf('/') >= 0) return cfg.name.split('/')[s === RED ? 0 : 1];
  return cfg.name;
}
function pieceValue(t) { var cfg = pieceCfg(t); return cfg ? cfg.value : 100; }
function canCaptureOf(cfg, side, r) { return (pawnCrossed(side, r) ? cfg.canCaptureA : cfg.canCaptureB) !== false; }
function capturableOf(cfg, side, r) { return (pawnCrossed(side, r) ? cfg.capturableA : cfg.capturableB) !== false; }

function validatePat(p) {
  if (p == null) return [];   // 缺省（如未启用首x步规则的前x步槽）→ 空列表
  // 单个走法或走法数组均可，统一归一化为数组（支持多种走法/吃法组合）
  var list = Array.isArray(p) ? p : [p];
  if (!list.length) return [];   // 空数组 = 无走法（不要回退成默认走法）
  var out = [];
  list.forEach(function(pp) {
    if (!pp || typeof pp !== 'object') return;
    var style = (pp.style === 'knight' || pp.style === 'tian' || pp.style === 'mu' || pp.style === 'mu2') ? pp.style : 'line';
    var dirs = [];
    if (style === 'line') {
      // 空方向合法：表示该阶段不能走/不能吃（如盾不可吃子）
      if (Array.isArray(pp.dirs)) {
        ['u','d','l','r','ul','ur','dl','dr'].forEach(function(d) { if (pp.dirs.indexOf(d) >= 0) dirs.push(d); });
      }
    }
    var dist = pp.dist === 'slide' ? 'slide' : ([1,2,3,4,5,6,7,8,9].indexOf(pp.dist) >= 0 ? pp.dist : 1);
    var jp = (pp.jump !== undefined) ? Math.max(0, Math.min(3, pp.jump | 0)) : (pp.screen ? 1 : 0);
    var offs = [];
    if (Array.isArray(pp.blockOffsets)) {
      pp.blockOffsets.forEach(function(o) {
        if (Array.isArray(o) && o.length >= 2) {
          var or2 = Math.max(-25, Math.min(25, o[0] | 0));   // 偏移上限放宽，覆盖自定义大棋盘（越界由 inB 兜底）
          var oc2 = Math.max(-25, Math.min(25, o[1] | 0));
          if (or2 !== 0 || oc2 !== 0) offs.push([or2, oc2]);
        }
      });
    }
    var one = { style: style, dirs: style === 'line' ? dirs : null, dist: dist, block: !!pp.block,
                screen: jp > 0, jump: jp, blockOffsets: offs, stayCapture: !!pp.stayCapture,
                fill: !!pp.fill, firstN: Math.max(0, Math.min(20, pp.firstN | 0)),
                land: Math.max(0, Math.min(9, pp.land | 0)),
                hop: !!pp.hop,
                afterN: Math.max(0, Math.min(20, pp.afterN | 0)) };
    if (pp.kind === 'slash') one.kind = 'slash';

      var tr = r + 2 * tdr, tc = c + 2 * tdc;

      if (pat.block && b[r + tdr][c + tdc]) continue;   // 象眼

function expandChains(b, pr, pc, side, out) {

          cap: t.hop ? (b[t.hop.r][t.hop.c] || null) : (b[t.r][t.c] || null),

function genTargets(b, r, c, captureOnly) {
  var p = b[r][c];

    if (!cfg.canLeavePalace) {

    }
    var q = b[tr][tc];
    if (q && q.s === s) return;
    if (q && q.t === K) return;   // 王不可被吃：应将必须先行，绝不直接吃王
    if (q && !capturableOf(pieceCfg(q.t, q.s), q.s, tr)) return;   // 不可被吃的子（按目标过河状态）

    var p = b[r][c];

function isInCheck(b, s) {

function legalMoves(b, r, c) {

      victim = b[t.hop.r][t.hop.c] || null;
      b[t.hop.r][t.hop.c] = null;
      b[r][c] = null;
      b[t.r][t.c] = p;
      safe = !isInCheck(b, p.s);
      b[t.hop.r][t.hop.c] = victim;
      b[r][c] = p;
      b[t.r][t.c] = null;

      b[t.r][t.c] = victim;
    } else {
      victim = b[t.r][t.c];
      b[r][c] = null;
      b[t.r][t.c] = p;

      b[t.r][t.c] = victim;

  for (var r = 0; r < bd.rows; r++) for (var c = 0; c < bd.cols; c++) {
    var p = b[r][c];
    if (!p || p.s !== side) continue;
    var list = legalMoves(b, r, c);
    for (var i = 0; i < list.length; i++) {
      var t = list[i];
      if (t.chain) {

      } else {

        if (t.stay) mv2.stay = true;
        if (t.hop) mv2.hop = t.hop;
        res.push(mv2);
      }
    }
  }
  // 强制吃子：有吃必吃（含连吃链），无吃子着法时不受限
  if (RULES.global.mustCapture && res.some(function(m) { return m.cap || m.steps; })) {
    res = res.filter(function(m) { return m.cap || m.steps; });
  }

function unmake(b, mv, cap) {

    mv._undo.forEach(function(u) {
      u.piece.lastMoved = mv._oldLastMoved;
      u.piece.moveCount = (u.piece.moveCount || 1) - 1;
      if (u.cap) u.piece.captureCount = (u.piece.captureCount || 1) - 1;
      b[u.from.r][u.from.c] = u.piece;
      if (u.hop) { b[u.hop.r][u.hop.c] = u.cap; b[u.to.r][u.to.c] = null; }   // 跳吃：被吃子放回 hop 格
      else b[u.to.r][u.to.c] = u.cap;
    });
    mv._undo = null;
    return;
  }
  mv.piece.lastMoved = mv._oldLastMoved;
  mv.piece.moveCount = (mv.piece.moveCount || 1) - 1;
  if (cap) mv.piece.captureCount = (mv.piece.captureCount || 1) - 1;
  if (mv.hop) {                              // 跳吃/越落：被吃子放回 hop 格
    b[mv.hop.r][mv.hop.c] = cap;
    b[mv.from.r][mv.from.c] = mv.piece;
    b[mv.to.r][mv.to.c] = null;
  } else if (mv.stay) {
    b[mv.to.r][mv.to.c] = cap;
  } else {
    b[mv.from.r][mv.from.c] = mv.piece;
    b[mv.to.r][mv.to.c] = cap;
  }
}

function defTransform() {
  return { enabled: false, when: { cross: false, moves: 0, captures: 0, reachBack: false, afterPlies: 0 }, to: '', revert: false };
}
function validateTransform(tf) {
  if (!tf || typeof tf !== 'object' || tf.enabled !== true) return defTransform();
  var w = tf.when || {};
  return {
    enabled: true,
    when: {
      cross: !!w.cross,
      moves: Math.max(0, Math.min(200, w.moves | 0)),
      captures: Math.max(0, Math.min(200, w.captures | 0)),
      reachBack: !!w.reachBack,
      afterPlies: Math.max(0, Math.min(400, w.afterPlies | 0))

    to: (typeof tf.to === 'string' && tf.to) ? tf.to : '',

}
function tfSatisfied(tf, p, r, c) {

  if (w.moves > 0 && (p.moveCount || 0) >= w.moves) return true;   // 走满 N 步
  if (w.captures > 0 && (p.captureCount || 0) >= w.captures) return true;  // 吃满 N 子
  if (w.reachBack && (p.s === RED ? r === 0 : r === (RULES.board || DEFAULT_RULES.board).rows - 1)) return true;   // 到达对方底线
  if (w.afterPlies > 0 && PLIES >= w.afterPlies) return true;      // 开局 N 半着后
  return false;
}
// 每次真实走子后调用；AI 搜索内不触发（近似：搜索视作未变身）
function applyTransforms(board) {
  var bd = RULES.board || DEFAULT_RULES.board;
  for (var r = 0; r < bd.rows; r++) for (var c = 0; c < bd.cols; c++) {
    var p = board[r][c];
    if (!p || p.t === K) continue;
    // 已变身棋子：可逆回退依据"原类型"的变身配置判定
    if (p._baseType) {
      var bc = pieceCfg(p._baseType, p.s);
      var bt = bc && bc.transform;
      if (bt && bt.enabled && bt.revert && !tfSatisfied(bt, p, r, c)) {
        p.t = p._baseType;
        p._baseType = undefined;
      }
      continue;
    }
    var cfg = pieceCfg(p.t, p.s);
    if (!cfg || !cfg.transform || !cfg.transform.enabled) continue;
    var tf = cfg.transform;
    if (tfSatisfied(tf, p, r, c)) {
      if (p.t !== tf.to && pieceCfg(tf.to, p.s)) {
        p._baseType = p.t;        // 记录原类型（可逆时变回）
        p.t = tf.to;
      }
    }
  }
}

function hasWinningChance(b, side) {
  var bd = RULES.board || DEFAULT_RULES.board;
  for (var r = 0; r < bd.rows; r++) for (var c = 0; c < bd.cols; c++) {
    var p = b[r][c];
    if (!p || p.s !== side) continue;
    var t = p.t, cfg = pieceCfg(t, side);
    if (!cfg) continue;
    if (canCaptureOf(cfg, side, r) === false) continue;
    if (t === K || t === A) continue;                                     // 帅仕无法取胜
    if (t === E && !(cfg.canCrossRiver && cfg.canEnterPalace)) continue;  // 象默认无法取胜
    var cap = patsOf(pawnCrossed(side, r) ? cfg.capA : cfg.capB);
    for (var ci = 0; ci < cap.length; ci++) {
      if (cap[ci].style === 'knight' || cap[ci].style === 'tian' || cap[ci].style === 'mu' || cap[ci].style === 'mu2' || cap[ci].dirs.length) return true;
    }
  }
  return false;
}
function status(b, side, prevOcc, longJiang, pliesNoCap, longChase) {
  var k = findKing(b, side);
  if (!k) return { over: true, winner: 1 - side, reason: '王被吃' };
  // 吃光制胜：除王外无任何子力即判负（在将死/困毙判定之前）
  if (RULES.global.captureWin && !hasWinningMaterial(b, side)) return { over: true, winner: 1 - side, reason: '子力吃光' };
  var inCheck = isInCheck(b, side);
  var moves = allLegalMoves(b, side);
  if (moves.length === 0) {
    if (inCheck) return { over: true, winner: 1 - side, reason: '将死' };
    return { over: true, winner: RULES.global.stalemateIsLoss ? 1 - side : -1,
             reason: RULES.global.stalemateIsLoss ? '困毙' : '困毙（判和）' };
  }
  if (prevOcc >= 2 && RULES.global.repetitionIsDraw) {
    if (RULES.global.perpetualCheckIsLoss && longJiang) return { over: true, winner: side, reason: '长将判负' };
    if (RULES.global.chaseIsLoss && longChase) return { over: true, winner: side, reason: '长捉判负' };
    return { over: true, winner: -1, reason: '三次重复' };
  }
  if (RULES.global.noCaptureDraw && pliesNoCap >= RULES.global.noCaptureLimit) {
    return { over: true, winner: -1, reason: '自然限着' };
  }
  if (RULES.global.basicDraw && !inCheck && !hasWinningChance(b, RED) && !hasWinningChance(b, BLACK)) {
    return { over: true, winner: -1, reason: '例和' };
  }
  return { over: false, check: inCheck };
}

// 重复局面表条目：{ n:出现次数, chk:最近一次出现时行棋方是否将军,
//   prevChk:上上次是否将军, chkSide:最近一次行棋方, prevChkSide:上��次行棋方,
//   chase/prevChase/chaseSide/prevChaseSide: 同样式记录"长捉" }
function newRepEntry(wasChk, mover) {
  return { n: 1, chk: !!wasChk, prevChk: false, chkSide: mover === undefined ? -1 : mover, prevChkSide: -1,
           chase: false, prevChase: false, chaseSide: -1, prevChaseSide: -1 };
}
function recordPosition(rep, board, sideToMove, wasChk, wasChase) {
  var k = positionKey(board, sideToMove);
  var e = rep[k] || newRepEntry(false, -1);
  e.prevChk = e.chk; e.prevChkSide = e.chkSide;
  e.prevChase = e.chase; e.prevChaseSide = e.chaseSide;
  e.n++; e.chk = !!wasChk; e.chkSide = 1 - sideToMove;
  e.chase = !!wasChase; e.chaseSide = 1 - sideToMove;
  rep[k] = e;
}
function longJiangOf(rep, board, sideToMove) {
  var e = rep[positionKey(board, sideToMove)];
  return !!(e && e.n >= 3 && e.chk && e.prevChk && e.chkSide === e.prevChkSide && e.chkSide !== -1);
}
function longChaseOf(rep, board, sideToMove) {
  var e = rep[positionKey(board, sideToMove)];
  return !!(e && e.n >= 3 && e.chase && e.prevChase && e.chaseSide === e.prevChaseSide && e.chaseSide !== -1);
}

// 捉：己方刚走的子（非王）在着法后攻击某敌子（非王、可被吃），且该敌子无根（无其他敌子保护）
//   或攻击方子力价值低于被捉子（吃之有利）。解将着（行棋前己方被将军）不算捉；将军着按"将"处理不算捉。
function targetProtected(b, r, c, s) {
  var bd = RULES.board || DEFAULT_RULES.board;
  for (var r2 = 0; r2 < bd.rows; r2++) for (var c2 = 0; c2 < bd.cols; c2++) {
    var p2 = b[r2][c2];
    if (!p2 || p2.s !== s) continue;
    if (r2 === r && c2 === c) continue;          // 排除目标本身
    if (pieceAttacks(b, r2, c2, r, c)) return true;
  }
  return false;
}
function moveIsChase(b, mv) {
  var p = mv.piece;
  if (!p || p.t === K) return false;
  var bd = RULES.board || DEFAULT_RULES.board;
  var tr = mv.to.r, tc = mv.to.c;
  for (var r = 0; r < bd.rows; r++) for (var c = 0; c < bd.cols; c++) {
    var q = b[r][c];
    if (!q || q.s === p.s || q.t === K) continue;
    if (!capturableOf(pieceCfg(q.t, q.s), q.s, r)) continue;          // 不可被吃的不算被捉
    if (!pieceAttacks(b, tr, tc, r, c)) continue;                     // 刚动的子攻击到 q
    if (targetProtected(b, r, c, q.s)) {
      if (pieceValue(p.t) >= pieceValue(q.t)) continue;              // 有根且价值不低于对方 → 不算捉
    }
    return true;
  }
  return false;

function positionKey(b, side) {
  var s = side ? '1' : '0';
  var bd = RULES.board || DEFAULT_RULES.board;
  for (var r = 0; r < bd.rows; r++) for (var c = 0; c < bd.cols; c++) {
    var p = b[r][c];
    s += p ? p.t + p.s : '.';
  }
  return s;
}

function notate(mv) {
  if (mv.steps) {   // 连吃链：记首着 + 连吃
    var f0 = mv.steps[0];
    return notate({ from: f0.from, to: f0.to, piece: f0.piece, cap: f0.cap }) + '连吃';
  }
  var p = mv.piece, s = p.s;
  var name = pieceName(p.t, s);
  var bdN = RULES.board || DEFAULT_RULES.board;
  var fFrom = s === RED ? bdN.cols - mv.from.c : mv.from.c + 1;
  var fTo   = s === RED ? bdN.cols - mv.to.c   : mv.to.c + 1;
  var dR = mv.to.r - mv.from.r;
  var fwd = s === RED ? dR < 0 : dR > 0;
  if (mv.to.c === mv.from.c) {
    return name + fileLabel(fFrom) + (fwd ? '进' : '退') + fileLabel(Math.abs(dR));
  }
  if (dR === 0) return name + fileLabel(fFrom) + '平' + fileLabel(fTo);
  return name + fileLabel(fFrom) + (fwd ? '进' : '退') + fileLabel(fTo);
}

function evaluate(b) {
  var score = 0, hasK = [false, false];
  var bd = RULES.board || DEFAULT_RULES.board;
  for (var r = 0; r < bd.rows; r++) for (var c = 0; c < bd.cols; c++) {
    var q = b[r][c];
    if (!q) continue;
    hasK[q.s] = true;
    var v = pieceValue(q.t);
    if (q.t === P) v += (q.s === RED ? (bd.rows - 1) - r : r) * 7 + (pawnCrossed(q.s, r) ? 45 : 0)
                   + ((bd.cols - 1 - Math.abs(c - Math.floor((bd.cols - 1) / 2))) * 1.5)
                   + (c === Math.floor((bd.cols - 1) / 2) ? 15 : 0);   // 过河兵价值更高；中路微偏；中兵保护分
    else if (q.t === H || q.t === C) v += ((bd.cols - 1) - Math.abs(c - Math.floor((bd.cols - 1) / 2))) * 2;   // 中路微偏
    // 开局阵型（前 10 半着）：马在底线 +60、炮在炮位 +20——开局出子价值，抑制"开局炮打马"等盲目兑子
    if (PLIES < 10) {
      if (q.t === H && r === (q.s === RED ? bd.rows - 1 : 0)) v += 60;
      if (q.t === C && r === (q.s === RED ? bd.rows - 3 : 2)) v += 20;
      else if (q.t === C && r !== (q.s === RED ? bd.rows - 3 : 2)) v -= 25;
    }
    score += q.s === RED ? v : -v;
  }
  if (!hasK[RED]) return -MATE;
  if (!hasK[BLACK]) return MATE;
  return score;
}

// 静态交换评估（SEE）：吃子着法的真实净收益——沿吃子链交替吃回，看穿"炮打马被吃回"式假赚兑子
// dead 跟踪已参与吃子链的攻击者（被吃掉的棋子不能再吃回）
function seeEval(b, mv) {
  var sqR = mv.to.r, sqC = mv.to.c;
  var total = pieceValue(mv.cap.t);      // 第一吃所得
  var side = 1 - mv.piece.s;             // 轮到对方吃回
  var lastVal = pieceValue(mv.piece.t);  // 当前 sq 上棋子的价值（攻击者）
  var dead = {};                         // 已死的攻击者位置
  dead[mv.from.r + ',' + mv.from.c] = true;

  while (guard++ < 6) {
    var minV = Infinity, found = false, atkR = -1, atkC = -1;
    var bd = RULES.board || DEFAULT_RULES.board;
    for (var r = 0; r < bd.rows; r++) for (var c = 0; c < bd.cols; c++) {
      var q = b[r][c];
      if (!q || q.s !== side || q.t === K) continue;
      if (dead[r + ',' + c]) continue;               // 已死棋子不能吃回
      if (pieceAttacks(b, r, c, sqR, sqC)) {
        var v = pieceValue(q.t);
        if (v < minV) { minV = v; atkR = r; atkC = c; }
        found = true;
      }
    }
    if (!found) break;
    if (side === mv.piece.s && minV >= lastVal) break;   // 己方吃回代价 ≥ 所得 → 不划算停止
    total += (side === mv.piece.s ? 1 : -1) * lastVal;   // 对方吃回（失 lastVal），己方吃回（得 lastVal）
    lastVal = minV;                                      // 攻击者落到 sq，成为下一个被吃对象
    dead[atkR + ',' + atkC] = true;                      // 攻击者离开原位置（原位置空）
    side = 1 - side;
  }
  return total;

function orderMoves(moves) {
  return moves.slice().sort(function(a, b) {
    var va = a.cap ? pieceValue(a.cap.t) : 0;
    var vb = b.cap ? pieceValue(b.cap.t) : 0;
    return vb - va;
  });
}

function negamax(b, side, depth, alpha, beta, deadline) {
  if (Date.now() > deadline) throw ERR_TIMEOUT;
  var moves = orderMoves(allLegalMoves(b, side));
  if (moves.length === 0) {
    if (isInCheck(b, side)) return -(MATE - depth * 100);                    // 被将死（越快越好）
    return RULES.global.stalemateIsLoss ? -(MATE - depth * 100) : 0;         // 困毙：按规则判负或判和
  }
  if (depth <= 0) {
    var ev = evaluate(b);
    return side === RED ? ev : -ev;
  }
  var best = -Infinity;
  for (var i = 0; i < moves.length; i++) {
    var mv = moves[i];
    var cap = makeMove(b, mv); PLIES++;
    var v;
    try {
      v = -negamax(b, 1 - side, depth - 1, -beta, -alpha, deadline);
    } finally {
      PLIES--; unmake(b, mv, cap);   // 即使超时抛出也必须撤销，否则棋盘损坏（会致"王被吃"）
    }
    if (v > best) best = v;
    if (best > alpha) alpha = best;
    if (alpha >= beta) break;
  }
  return best;
}

    [9,7,7,6], [0,8,0,7],   // 马二进三 车9平8
    [9,8,9,7], [3,6,4,6],   // 车一平二 卒7进1
    [9,7,3,7], [0,1,2,2],   // 车二进六 马2进3
    [6,2,5,2], [0,3,1,4]    // 兵七进一 士4进5

  [ // 中炮对顺炮
    [7,7,7,4], [2,7,2,4],   // 炮二平五 炮8平5
    [9,7,7,6], [0,7,2,6],   // 马二进三 马8进7
    [9,1,7,2], [0,8,0,7],   // 马八进七 车9平8
    [9,8,9,7], [3,6,4,6],   // 车一平二 卒7进1
    [9,7,3,7], [0,1,2,2]    // 车二进六 马2进3
  ],
  [ // 仙人指路对卒底炮
    [6,2,5,2], [3,6,4,6],   // 兵七进一 卒7进1
    [7,7,7,4], [2,7,2,4],   // 炮二平五 炮8平5
    [9,7,7,6], [0,7,2,6],   // 马二进三 马8进7
    [9,1,7,2], [0,8,0,7]    // 马八进七 车9平8
  ],
  [ // 中炮进三兵对屏风马
    [7,7,7,4], [0,7,2,6],   // 炮二平五 马8进7
    [9,7,7,6], [3,2,4,2],   // 马二进三 卒3进1
    [6,6,5,6], [0,1,2,2],   // 兵三进一 马2进3
    [9,1,7,2], [0,8,0,7],   // 马八进七 车9平8
    [9,8,9,7], [2,7,4,7]    // 车一平二 炮8进2
  ],
  [ // 飞相局对左中炮
    [9,6,7,4], [2,7,2,4],   // 相三进五 炮8平5
    [9,1,7,2], [0,7,2,6],   // 马八进七 马8进7
    [6,6,5,6], [0,8,0,7]    // 兵三进一 车9平8
  ]

// 开局谱着法：首着随机定谱，之后严格跟完整谱；谱着法不合法自动脱谱（回退评估）
var bookLineIdx = -1;   // 当前激活谱索引（-1=未定谱；每局开始/悔棋时重置）

function bookMove(b, side, usable) {
  if (PLIES >= OPENING_MAX_PLIES) return null;
  var match = function(e) {
    for (var j = 0; j < usable.length; j++) {
      var m = usable[j];
      if (m.from.r === e[0] && m.from.c === e[1] && m.to.r === e[2] && m.to.c === e[3]) return m;
    }
    return null;
  };
  if (bookLineIdx >= 0) {
    // 已定谱：严格走谱内当前步；谱断（着法不合法）→ 脱谱
    var line = OPENING_LINES[bookLineIdx];
    if (PLIES < line.length && (PLIES % 2 === 0) === (side === RED)) {
      var m0 = match(line[PLIES]);
      if (m0) return m0;
    }
    bookLineIdx = -1;
    return null;
  }
  // 未定谱：收集各谱当前步，随机定谱
  var cands = [];
  for (var li = 0; li < OPENING_LINES.length; li++) {
    var ln = OPENING_LINES[li];
    if (PLIES >= ln.length) continue;
    if ((PLIES % 2 === 0) !== (side === RED)) continue;
    var m1 = match(ln[PLIES]);
    if (m1) cands.push({ line: li, mv: m1 });
  }
  if (!cands.length) return null;
  var pick = cands[Math.floor(Math.random() * cands.length)];
  bookLineIdx = pick.line;   // 定谱：后续严格跟此谱
  return pick.mv;
}

function aiMove(b, side, depth, timeLimitMs, repeatCounts, style) {
  var moves = orderMoves(allLegalMoves(b, side));

  var usable = moves;
  if (repeatCounts && repeatCounts.size) {
    var filtered = [];
    for (var i = 0; i < moves.length; i++) {
      var m0 = moves[i];
      var c0 = makeMove(b, m0); PLIES++;

      PLIES--; unmake(b, m0, c0);

  for (var d = 1; d <= depthMax; d++) {
    var cur = null, curVal = -Infinity, alpha = -Infinity, ties = [];
    // 每层独立时限（用剩余总时限）：前几层快速完成后高层有预算；总时限到即截断，不卡顿
    var remain = (timeLimitMs || 2000) - (Date.now() - tStart);
    var dLine = Date.now() + Math.max(30, Math.min(remain, 150 + d * 300));
    try {
      for (var j = 0; j < usable.length; j++) {
        var mv = usable[j];
        var cap = makeMove(b, mv); PLIES++;
        var v;
        try {
          v = -negamax(b, 1 - side, d - 1, -Infinity, alpha, dLine);
        } finally {
          PLIES--; unmake(b, mv, cap);   // 超时抛出也必须撤销
        }
        if (v > curVal) { curVal = v; cur = mv; ties = [mv]; }
        else if (v === curVal) { ties.push(mv); }
        if (v > alpha) alpha = v;
      }
    } catch (e) {
      if (e !== ERR_TIMEOUT) throw e;   // 超时：保留上一迭代结果
    }
    if (cur) {
      best = cur; bestVal = curVal;
      if (ties.length > 1) best = ties[(Date.now() + d * 7919) % ties.length | 0];   // 同分随机
    }
    if (Date.now() - tStart > (timeLimitMs || 2000)) break;   // 总时限强制截断
  }
  return best;
}

function makeBoard(list) {
  var b = emptyBoard();
  list.forEach(function(it) { b[it.r][it.c] = { t: it.t, s: it.s }; });
  return b;
}

    resetRules();

    var b30c = makeBoard([{t:R,s:RED,r:5,c:3},{t:K,s:BLACK,r:0,c:4}]);
    var ml30c = legalMoves(b30c, 5, 3);
    assert(!hasMove(ml30c, 0, 3) && !hasMove(ml30c, 2, 3) && hasMove(ml30c, 3, 3), '30c.通用入对方九宫对车生效');

    // 31 可吃子开关：关闭后不能吃子也不能将军，但可正常移动
    resetRules();
    RULES.pieces.r.canCaptureB = RULES.pieces.r.canCaptureA = false;
    var b31 = makeBoard([{t:R,s:RED,r:5,c:0},{t:K,s:BLACK,r:5,c:8}]);
    var ml31 = legalMoves(b31, 5, 0);
    assert(hasMove(ml31, 5, 2) && !hasMove(ml31, 5, 8) && !isInCheck(b31, BLACK), '31.可吃子开关');

    // 32 过河前后可吃子/可被吃独立（"过河前不可吃/不可被吃，过河后放开"的兵）
    resetRules();
    RULES.pieces.p.canCaptureB = false;     // 过河前不能吃子
    RULES.pieces.p.capturableB = false;     // 过河前不能被吃
    var b32 = makeBoard([{t:P,s:RED,r:6,c:4},{t:K,s:BLACK,r:5,c:4},{t:K,s:RED,r:9,c:4}]);
    assert(!hasMove(legalMoves(b32, 6, 4), 5, 4) && !isInCheck(b32, BLACK), '32a.过河前不可吃子');
    var b32b = makeBoard([{t:P,s:RED,r:6,c:4},{t:R,s:BLACK,r:0,c:4},{t:K,s:RED,r:9,c:0},{t:K,s:BLACK,r:0,c:8}]);
    assert(!hasMove(legalMoves(b32b, 0, 4), 6, 4), '32b.过河前不可被吃');
    var b32c = makeBoard([{t:P,s:RED,r:3,c:4},{t:R,s:BLACK,r:2,c:4},{t:K,s:RED,r:9,c:0},{t:K,s:BLACK,r:0,c:8}]);
    assert(hasMove(legalMoves(b32c, 3, 4), 2, 4), '32c.过河后可吃子');
    var b32d = makeBoard([{t:P,s:RED,r:4,c:4},{t:R,s:BLACK,r:0,c:4},{t:K,s:RED,r:9,c:0},{t:K,s:BLACK,r:0,c:8}]);
    assert(hasMove(legalMoves(b32d, 0, 4), 4, 4), '32d.过河后可被吃');

    // 33 红方与黑方规则不同（黑兵过河前不可吃，红兵不受影响）
    resetRules();
    RULES.pieces.p.diffSides = true;
    RULES.pieces.p.cfgBlack = JSON.parse(JSON.stringify(RULES.pieces.p));
    RULES.pieces.p.cfgBlack.canCaptureB = false;
    var b33 = makeBoard([{t:P,s:RED,r:6,c:4},{t:R,s:BLACK,r:5,c:4},{t:K,s:RED,r:9,c:0},{t:K,s:BLACK,r:0,c:8}]);
    assert(hasMove(legalMoves(b33, 6, 4), 5, 4), '33a.红兵按红配置可吃');
    var b33b = makeBoard([{t:P,s:BLACK,r:3,c:4},{t:K,s:RED,r:4,c:4},{t:K,s:BLACK,r:0,c:0}]);
    assert(!hasMove(legalMoves(b33b, 3, 4), 4, 4) && !isInCheck(b33b, RED), '33b.黑兵按黑配置不可吃');

    // 34 越子移动：车 jump=1 越过一子落其后
    resetRules();
    RULES.pieces.r.moveB[0].jump = 1;
    var b34 = makeBoard([{t:R,s:RED,r:5,c:0},{t:P,s:BLACK,r:5,c:2},{t:K,s:RED,r:9,c:0},{t:K,s:BLACK,r:0,c:8}]);
    var ml34 = legalMoves(b34, 5, 0);
    assert(hasMove(ml34, 5, 3) && hasMove(ml34, 5, 4) && hasMove(ml34, 5, 2), '34a.移动可越1子');
    RULES.pieces.r.moveB[0].jump = 0;
    var ml34b = legalMoves(b34, 5, 0);
    assert(!hasMove(ml34b, 5, 3), '34b.越0子不可越过');

    // 35 隔2子吃（双炮架）
    resetRules();
    RULES.pieces.r.capB[0].jump = 2;
    var b35 = makeBoard([{t:R,s:RED,r:5,c:0},{t:P,s:RED,r:5,c:2},{t:P,s:BLACK,r:5,c:4},{t:P,s:BLACK,r:5,c:6},{t:K,s:RED,r:9,c:0},{t:K,s:BLACK,r:0,c:8}]);
    var ml35 = legalMoves(b35, 5, 0);
    assert(hasMove(ml35, 5, 6) && !hasMove(ml35, 5, 4), '35.隔2子吃');

    // 36 原地吃
    resetRules();
    RULES.pieces.r.capB[0].stayCapture = true;
    var b36 = makeBoard([{t:R,s:RED,r:5,c:0},{t:P,s:BLACK,r:5,c:2},{t:K,s:RED,r:9,c:0},{t:K,s:BLACK,r:0,c:8}]);
    var t36 = legalMoves(b36, 5, 0).find(function(m) { return m.r === 5 && m.c === 2; });
    assert(!!t36 && t36.stay === true, '36a.原地吃标记');
    makeMove(b36, { from:{r:5,c:0}, to:{r:5,c:2}, piece: b36[5][0], cap: b36[5][2], stay: true });
    assert(b36[5][0] && b36[5][0].t === R && b36[5][2] === null, '36b.原地吃后不移动');

    // 37 连吃链（两连吃）
    resetRules();
    RULES.pieces.r.chainCapture = true;
    var b37 = makeBoard([{t:R,s:RED,r:5,c:0},{t:P,s:BLACK,r:5,c:2},{t:P,s:BLACK,r:5,c:4},{t:K,s:RED,r:9,c:0},{t:K,s:BLACK,r:0,c:8}]);
    var ch37 = legalMoves(b37, 5, 0).find(function(m) { return m.chain && m.steps.length === 2; });
    assert(!!ch37 && ch37.r === 5 && ch37.c === 4, '37a.两连吃链');
    var cap37 = makeMove(b37, ch37);
    assert(b37[5][4] && b37[5][4].t === R && b37[5][2] === null && b37[5][0] === null, '37b.链整体应用');
    unmake(b37, ch37, cap37);
    assert(b37[5][0] && b37[5][2] && b37[5][4], '37c.链回滚');

    // 38 变身：过河变车 + 可逆变回
    resetRules();
    RULES.pieces.p.transform = { enabled: true, when: { cross: true }, to: 'r', revert: true };
    var b38 = makeBoard([{t:P,s:RED,r:6,c:4},{t:K,s:RED,r:9,c:0},{t:K,s:BLACK,r:0,c:8}]);
    setPlies(0);
    makeMove(b38, { from:{r:6,c:4}, to:{r:5,c:4}, piece: b38[6][4], cap: null }); setPlies(1);
    applyTransforms(b38);
    makeMove(b38, { from:{r:5,c:4}, to:{r:4,c:4}, piece: b38[5][4], cap: null }); setPlies(2);
    applyTransforms(b38);
    assert(b38[4][4] && b38[4][4].t === R, '38a.过河变身车');
    makeMove(b38, { from:{r:4,c:4}, to:{r:5,c:4}, piece: b38[4][4], cap: null }); setPlies(3);
    applyTransforms(b38);
    assert(b38[5][4] && b38[5][4].t === P, '38b.可逆变回兵');

    // 39 变身其他条件：走满 3 步变炮
    resetRules();
    RULES.pieces.p.transform = { enabled: true, when: { moves: 3 }, to: 'c', revert: false };
    var b39 = makeBoard([{t:P,s:RED,r:8,c:4},{t:K,s:RED,r:9,c:0},{t:K,s:BLACK,r:0,c:8}]);
    setPlies(0);
    for (var i39 = 0; i39 < 3; i39++) {
      makeMove(b39, { from:{r:8-i39,c:4}, to:{r:7-i39,c:4}, piece: b39[8-i39][4], cap: null });
      setPlies(i39 + 1);
      applyTransforms(b39);
    }
    assert(b39[5][4] && b39[5][4].t === C, '39.走满3步变身炮');

    // 40 填充：走3格填充 → 1..3 任意步；阻挡止步
    resetRules();
    RULES.pieces.r.moveB[0] = { style:'line', dirs:['u'], dist:3, block:false, screen:false, jump:0, blockOffsets:[], stayCapture:false, fill:true, firstN:0 };
    var b40 = makeBoard([{t:R,s:RED,r:5,c:4},{t:K,s:RED,r:9,c:0},{t:K,s:BLACK,r:0,c:8}]);
    var m40 = legalMoves(b40, 5, 4);
    assert(hasMove(m40,4,4) && hasMove(m40,3,4) && hasMove(m40,2,4), '40a.填充1..3任意步');
    var b40b = makeBoard([{t:R,s:RED,r:5,c:4},{t:P,s:BLACK,r:3,c:4},{t:K,s:RED,r:9,c:0},{t:K,s:BLACK,r:0,c:8}]);
    assert(hasMove(legalMoves(b40b,5,4),4,4) && !hasMove(legalMoves(b40b,5,4),2,4), '40b.填充被阻挡止步');

    // 41 前 N 步特殊走法（国象兵首步可走1或2）
    resetRules();
    RULES.pieces.p.moveB = [
      { style:'line', dirs:['u'], dist:1, block:false, screen:false, jump:0, blockOffsets:[], stayCapture:false, fill:false, firstN:0 },
      { style:'line', dirs:['u'], dist:2, block:false, screen:false, jump:0, blockOffsets:[], stayCapture:false, fill:false, firstN:1 }
    ];
    RULES.pieces.p.capB = JSON.parse(JSON.stringify(RULES.pieces.p.moveB));
    var b41 = makeBoard([{t:P,s:RED,r:6,c:4},{t:K,s:RED,r:9,c:0},{t:K,s:BLACK,r:0,c:8}]);
    var m41 = legalMoves(b41, 6, 4);
    assert(hasMove(m41,5,4) && hasMove(m41,4,4), '41a.首步可走1或2');
    makeMove(b41, { from:{r:6,c:4}, to:{r:5,c:4}, piece: b41[6][4], cap: null }); setPlies(1);
    var m41b = legalMoves(b41, 5, 4);
    assert(hasMove(m41b,4,4) && !hasMove(m41b,3,4), '41b.第二步2格不可用');

    // 42 小目字跳（1×3）
    resetRules();
    RULES.pieces.r.moveB[0] = { style:'mu2', dirs:null, dist:1, block:false, screen:false, jump:0, blockOffsets:[], stayCapture:false, fill:false, firstN:0 };
    var b42 = makeBoard([{t:R,s:RED,r:5,c:4},{t:K,s:RED,r:9,c:0},{t:K,s:BLACK,r:0,c:8}]);
    var m42 = legalMoves(b42, 5, 4);
    assert(hasMove(m42,4,7) && hasMove(m42,8,5) && !hasMove(m42,7,7), '42.小目字跳(1×3)');

    // 43 首x步规则不同（diffFirst）：moveF 前2步专用，moveB 第2步之后才可用
    resetRules();
    RULES.pieces.p.diffFirst = true;
    RULES.pieces.p.moveF = [
      { style:'line', dirs:['u'], dist:1, block:false, screen:false, jump:0, blockOffsets:[], stayCapture:false, fill:false, firstN:2, afterN:0 },
      { style:'line', dirs:['u'], dist:2, block:false, screen:false, jump:0, blockOffsets:[], stayCapture:false, fill:false, firstN:2, afterN:0 }
    ];
    RULES.pieces.p.moveB = [{ style:'line', dirs:['u'], dist:1, block:false, screen:false, jump:0, blockOffsets:[], stayCapture:false, fill:false, firstN:0, afterN:2 }];
    RULES.pieces.p.capF = []; RULES.pieces.p.capB = JSON.parse(JSON.stringify(RULES.pieces.p.moveB));
    var b43 = makeBoard([{t:P,s:RED,r:6,c:4},{t:K,s:RED,r:9,c:0},{t:K,s:BLACK,r:0,c:8}]);
    var m43 = legalMoves(b43, 6, 4);
    assert(hasMove(m43,5,4) && hasMove(m43,4,4), '43a.前2步可走1或2格');
    makeMove(b43, { from:{r:6,c:4}, to:{r:5,c:4}, piece: b43[6][4], cap: null }); setPlies(1);
    makeMove(b43, { from:{r:5,c:4}, to:{r:4,c:4}, piece: b43[5][4], cap: null }); setPlies(2);
    var m43b = legalMoves(b43, 4, 4);
    assert(hasMove(m43b,3,4) && !hasMove(m43b,2,4), '43b.第3步起2格不可用');

    // 44 落点限制（走法）：越 1 子只能落在被越子旁 1 格（跳棋式移动）
    resetRules();
    RULES.pieces.r.moveB[0] = { style:'line', dirs:['l'], dist:'slide', block:false, screen:false, jump:1, blockOffsets:[], stayCapture:false, fill:false, firstN:0, land:1, hop:false, afterN:0 };
    RULES.pieces.r.capB[0] = { style:'line', dirs:['l'], dist:'slide', block:false, screen:false, jump:0, blockOffsets:[], stayCapture:false, fill:false, firstN:0, land:0, hop:true, afterN:0 };
    var b44 = makeBoard([{t:R,s:RED,r:5,c:4},{t:P,s:BLACK,r:5,c:2},{t:K,s:RED,r:9,c:0},{t:K,s:BLACK,r:0,c:8}]);
    var m44 = legalMoves(b44, 5, 4);
    assert(hasMove(m44,5,1) && !hasMove(m44,5,0) && !hasMove(m44,5,3), '44a.越1子落点限制1格');
    var b44b = makeBoard([{t:R,s:RED,r:5,c:4},{t:P,s:BLACK,r:5,c:2},{t:P,s:RED,r:5,c:1},{t:K,s:RED,r:9,c:0},{t:K,s:BLACK,r:0,c:8}]);
    assert(!hasMove(legalMoves(b44b,5,4),5,1), '44b.落点被占不可落');
    var b44c = makeBoard([{t:R,s:RED,r:5,c:4},{t:P,s:BLACK,r:5,c:2},{t:P,s:RED,r:5,c:3},{t:K,s:RED,r:9,c:0},{t:K,s:BLACK,r:0,c:8}]);
    assert(!hasMove(legalMoves(b44c,5,4),5,1), '44c.两子之间不可多越');
    RULES.pieces.r.moveB[0] = { style:'line', dirs:['l'], dist:'slide', block:false, screen:false, jump:2, blockOffsets:[], stayCapture:false, fill:false, firstN:0, land:1, hop:false, afterN:0 };
    var b44d = makeBoard([{t:R,s:RED,r:5,c:5},{t:P,s:BLACK,r:5,c:3},{t:P,s:BLACK,r:5,c:1},{t:K,s:RED,r:9,c:0},{t:K,s:BLACK,r:0,c:8}]);
    var m44d = legalMoves(b44d, 5, 5);
    assert(hasMove(m44d,5,0) && !hasMove(m44d,5,4), '44d.越2子落点限制1格');
    // 44e 越子数=必须恰好越过（无落点限制）：不可停在越前空位、不可越过 2 子
    RULES.pieces.r.moveB[0] = { style:'line', dirs:['l'], dist:'slide', block:false, screen:false, jump:1, blockOffsets:[], stayCapture:false, fill:false, firstN:0, land:0, hop:false, afterN:0 };
    RULES.pieces.r.capB[0] = JSON.parse(JSON.stringify(RULES.pieces.r.moveB[0]));
    var b44e = makeBoard([{t:R,s:RED,r:5,c:4},{t:P,s:RED,r:5,c:2},{t:P,s:RED,r:5,c:0},{t:K,s:RED,r:9,c:0},{t:K,s:BLACK,r:0,c:8}]);
    var m44e = legalMoves(b44e, 5, 4);
    assert(hasMove(m44e,5,1) && !hasMove(m44e,5,3) && !hasMove(m44e,5,0) && !hasMove(m44e,5,2), '44e.越1子必须恰好越1子');

    // 45 吃掉越过的子（吃法）：跳过敌子吃掉它，落其旁1格，可连吃
    resetRules();
    RULES.pieces.r.chainCapture = true;
    RULES.pieces.r.moveB[0] = { style:'line', dirs:['r'], dist:'slide', block:false, screen:false, jump:1, blockOffsets:[], stayCapture:false, fill:false, firstN:0, land:1, hop:false, afterN:0 };
    RULES.pieces.r.capB[0] = { style:'line', dirs:['r'], dist:'slide', block:false, screen:false, jump:0, blockOffsets:[], stayCapture:false, fill:false, firstN:0, land:0, hop:true, afterN:0 };
    var b45 = makeBoard([{t:R,s:RED,r:5,c:4},{t:P,s:BLACK,r:5,c:5},{t:P,s:BLACK,r:5,c:7},{t:K,s:RED,r:9,c:0},{t:K,s:BLACK,r:0,c:8}]);
    var m45 = legalMoves(b45, 5, 4);
    assert(hasMove(m45,5,6), '45a.跳吃：吃掉被越子落其旁1格');
    var direct45 = m45.some(function(m) { return !m.chain && m.r === 5 && m.c === 8; });
    assert(!direct45, '45b.不可跳两子（落点钉在被越子旁）');
    var ch45 = m45.find(function(m) { return m.chain && m.steps.length === 2; });
    assert(!!ch45 && ch45.r === 5 && ch45.c === 8 && ch45.steps[0].hop && ch45.steps[1].hop, '45c.跳吃可连吃（两连跳）');
    var cap45 = makeMove(b45, ch45);
    assert(b45[5][8] && b45[5][8].t === R && b45[5][5] === null && b45[5][7] === null && b45[5][6] === null, '45d.链整体应用：被越子全移除');
    unmake(b45, ch45, cap45);
    assert(b45[5][4] && b45[5][4].t === R && b45[5][5] && b45[5][7], '45e.链回滚');

    // 46 自定义棋盘 8×8（河3、九宫2×2）
    resetRules();
    RULES.board = { rows: 8, cols: 8, riverRow: 3, palaceRows: 2, palaceCols: 2 };
    assert(pawnCrossed(RED,3) && !pawnCrossed(RED,4) && pawnCrossed(BLACK,4) && !pawnCrossed(BLACK,3), '46a.河位置生效');
    var p46 = palace(RED);
    assert(p46.r0===6 && p46.r1===7 && p46.c0===3 && p46.c1===4, '46b.红九宫居中');
    assert(inEnemyPalace(RED,1,3) && !inEnemyPalace(RED,1,2) && !inEnemyPalace(RED,2,3), '46c.对方九宫判定');
    var b46 = makeBoard([{t:K,s:RED,r:7,c:3},{t:K,s:BLACK,r:0,c:1}]);   // 黑将避开照面列
    var m46 = legalMoves(b46,7,3);
    assert(hasMove(m46,6,3) && hasMove(m46,7,4) && !hasMove(m46,6,4) && !hasMove(m46,5,3) && !hasMove(m46,7,2), '46d.将帅限缩九宫（四向一步，斜格不可）');
    var s46 = standardSetup();
    assert(s46.red.k[0][0]===7 && s46.red.k[0][1]===3 && s46.red.r.length===1 && s46.red.r[0][1]===7, '46e.8列摆法将居中、车外侧裁掉');
    var b46f = initialBoard(); var n46 = 0;
    b46f.forEach(function(row){ row.forEach(function(p) { if (p) n46++; }); });
    assert(n46===28, '46f.8×8标准摆法 28 子');
    assert(notate({ from:{r:4,c:0}, to:{r:3,c:0}, piece:{t:P,s:RED}, cap:null })==='兵八进一', '46g.8列红方棋谱');
    // 47 导入校验与 clamp
    resetRules();
    var m47 = deepMergeRules(DEFAULT_RULES, { board: { rows:30, cols:2, riverRow:0, palaceRows:9, palaceCols:9 } });
    assert(m47.board.rows===26 && m47.board.cols===5 && m47.board.riverRow===1 && m47.board.palaceRows===5 && m47.board.palaceCols===5, '47a.board clamp');
    var m47b = deepMergeRules(DEFAULT_RULES, { board: { rows:8, cols:8 } });
    assert(m47b.board.rows===8 && m47b.board.cols===8 && m47b.board.riverRow===4 && m47b.board.palaceRows===3 && m47b.board.palaceCols===3, '47b.缺省字段取默认');
    // 48 强制吃子：有吃必吃（allLegalMoves 层面）
    resetRules();
    RULES.global.mustCapture = true;
    var b48 = makeBoard([{t:R,s:RED,r:5,c:0},{t:P,s:BLACK,r:5,c:2},{t:K,s:RED,r:9,c:0},{t:K,s:BLACK,r:0,c:8}]);
    var a48 = allLegalMoves(b48, RED);
    assert(a48.length > 0 && a48.every(function(m) { return !!m.cap; }), '48a.有吃必吃');
    assert(a48.some(function(m) { return m.to.r === 5 && m.to.c === 2; }), '48b.吃子着法保留');
    RULES.global.mustCapture = false;
    assert(allLegalMoves(b48, RED).some(function(m) { return !m.cap; }), '48c.关闭后普通走法恢复');
    RULES.global.mustCapture = true;
    var b48d = makeBoard([{t:K,s:RED,r:9,c:4},{t:K,s:BLACK,r:0,c:8}]);
    assert(allLegalMoves(b48d, RED).length > 0, '48d.无吃可吃时正常走棋');
    // 49 吃光制胜
    resetRules();
    RULES.global.captureWin = true;
    var b49 = makeBoard([{t:R,s:RED,r:5,c:0},{t:K,s:RED,r:9,c:0},{t:K,s:BLACK,r:0,c:4}]);
    var st49 = status(b49, BLACK, 0, false, 0);
    assert(st49.over && st49.winner === RED && st49.reason === '子力吃光', '49a.吃光制胜');
    RULES.global.captureWin = false;
    assert(!status(b49, BLACK, 0, false, 0).over, '49b.关闭后不判');
    // 50 随机摆法：对称、将帅中列、子数正确
    resetRules();

function statusText() { var st = state.st; if (!st) return '红方走棋'; if (st.over) { if (st.winner === -1) return '和棋（' + st.reason + '）'; return (st.winner === RED ? '红方' : '黑方') + '获胜（' + st.reason + '）'; } var t = (state.turn === RED ? '红方' : '黑方') + '走棋'; if (st.check) t += ' · 将军！'; if (state.paused) t += '（已暂停）'; return t; }
function renderStatus() { var el = $('status'), st = state.st; el.textContent = state.thinking && !st.over ? (state.turn === RED ? '红方' : '黑方') + '思考中…' : statusText(); el.className = 'status'; if (st && st.over) el.className += st.winner === -1 ? ' draw' : (st.winner === RED ? ' win-red' : ' win-black'); else if (st && st.check) el.className += ' check'; if (state.paused && !st.over) el.className += ' pause'; if (state.thinking && st && !st.over) el.className += ' think'; }
function renderLog() { var html = ''; for (var i = 0; i < state.history.length; i += 2) { var rd = i / 2 + 1; var a = notate(state.history[i].mv); var b = state.history[i + 1] ? notate(state.history[i + 1].mv) : ''; html += '<div><span class="num">' + rd + '.</span><span class="rd">' + a + '</span> <span class="bd">' + b + '</span></div>'; } $('moveLog').innerHTML = html; $('moveLog').scrollTop = $('moveLog').scrollHeight; }
function renderCaptured() { var redCap = [], blackCap = []; state.history.forEach(function(h) { if (h.cap) (h.cap.s === RED ? blackCap : redCap).push(pieceName(h.cap.t, h.cap.s)); }); $('capRed').textContent = redCap.length ? redCap.join(' ') : '—'; $('capBlack').textContent = blackCap.length ? blackCap.join(' ') : '—'; }
function renderAll() { renderPieces(); renderMarks(); renderStatus(); renderLog(); renderCaptured(); renderClocks(); }
function resetClocks() { var tmin = RULES.global.timeMinutes | 0; var el = $('clocks'); if (tmin <= 0) { state.clocks = [0, 0]; if (el) el.style.display = 'none'; if (state.clockTimer) { clearInterval(state.clockTimer); state.clockTimer = null; } return; } state.clocks = [tmin * 60000, tmin * 60000]; if (el) el.style.display = ''; if (!state.clockTimer) state.clockTimer = setInterval(tickClocks, 500); renderClocks(); }
function tickClocks() { if (state.over || state.paused || state.thinking) { renderClocks(); return; } state.clocks[state.turn] = Math.max(0, state.clocks[state.turn] - 500); if (state.clocks[state.turn] <= 0) { state.st = { over: true, winner: 1 - state.turn, reason: '超时' }; state.over = true; state.sel = null; state.legal = []; if (state.clockTimer) { clearInterval(state.clockTimer); state.clockTimer = null; } } renderClocks(); renderStatus(); }
function renderClocks() { var fmt = function (ms) { if (ms <= 0 && !(RULES.global.timeMinutes | 0)) return '--:--'; var m = Math.floor(ms / 60000), s2 = Math.floor((ms % 60000) / 1000); return (m < 10 ? '0' : '') + m + ':' + (s2 < 10 ? '0' : '') + s2; }; var elR = $('clkRed'), elB = $('clkBlack'); if (!elR || !elB) return; elR.textContent = fmt(state.clocks[RED]); elB.textContent = fmt(state.clocks[BLACK]); elR.className = 'clk red' + (state.turn === RED && !state.over ? ' active' : ''); elB.className = 'clk black' + (state.turn === BLACK && !state.over ? ' active' : ''); }
function refreshStatus() { var k = positionKey(state.board, state.turn); var e = state.rep[k]; var prev = e ? e.n - 1 : 0; state.st = status(state.board, state.turn, prev, longJiangOf(state.rep, state.board, state.turn), state.pliesNoCap, longChaseOf(state.rep, state.board, state.turn)); state.over = state.st.over; if (state.over) { state.sel = null; state.legal = []; } }
function newGame() { state.board = initialBoard(); state.turn = RED; state.history = []; state.rep = {}; state.plies = 0; setPlies(0); state.pliesNoCap = 0; state.rep[positionKey(state.board, RED)] = newRepEntry(false, -1); state.over = false; state.paused = false; state.thinking = false; state.sel = null; state.legal = []; resetClocks(); refreshStatus(); renderAll(); scheduleAI(); }
function doMove(mv) { setPlies(state.plies); var wasCheckBefore = isInCheck(state.board, state.turn); var cap = makeMove(state.board, mv); state.history.push({ mv: mv, cap: cap }); state.turn = 1 - state.turn; state.plies++; setPlies(state.plies); var wasChk = isInCheck(state.board, state.turn); applyTransforms(state.board); var wasChase = RULES.global.chaseIsLoss && !wasCheckBefore && !wasChk && mv.piece && mv.piece.t !== K && moveIsChase(state.board, mv); recordPosition(state.rep, state.board, state.turn, wasChk, wasChase); state.pliesNoCap = cap ? 0 : state.pliesNoCap + 1; state.sel = null; state.legal = []; refreshStatus(); renderAll(); if (!state.over) scheduleAI(); }
function select(r, c) { state.sel = { r: r, c: c }; state.legal = legalMoves(state.board, r, c); renderPieces(); renderMarks(); }
function deselect() { state.sel = null; state.legal = []; renderPieces(); renderMarks(); }
function clickBoard(e) { var g = boardGeom(), bd = RULES.board || DEFAULT_RULES.board; var rect = boardEl.getBoundingClientRect(); var x = (e.clientX - rect.left) / rect.width * g.VB_W - g.VB_X; var y = (e.clientY - rect.top) / rect.height * g.VB_H - g.VB_Y; var c = Math.round(x / CELL), r = Math.round(y / CELL); if (c < 0 || c >= bd.cols || r < 0 || r >= bd.rows) return; if (state.flip) { r = (bd.rows - 1) - r; c = (bd.cols - 1) - c; } if (state.over || state.paused) return; if (state.mode === 'watch') return; if (state.mode === 'ai' && state.turn === BLACK) return; var p = state.board[r][c]; if (state.sel) { if (p && p.s === state.turn) { select(r, c); return; } var found = null; state.legal.forEach(function(m) { if (m.r === r && m.c === c) found = m; }); if (found) { if (found.chain) { doMove(found); return; } var sp = state.board[state.sel.r][state.sel.c]; var mv2 = { from: { r: state.sel.r, c: state.sel.c }, to: { r: found.r, c: found.c }, piece: sp, cap: state.board[found.r][found.c] || null }; if (found.stay) mv2.stay = true; if (found.hop) mv2.hop = found.hop; doMove(mv2); } else deselect(); } else if (p && p.s === state.turn) select(r, c); }
function scheduleAI() { if (state.over || state.paused || state.thinking) return; var needAI = (state.mode === 'ai' && state.turn === BLACK) || state.mode === 'watch'; if (!needAI) return; state.thinking = true; renderStatus(); var delay = state.mode === 'watch' ? 500 : 400; setTimeout(function() { doAIMove(); }, delay); }
function doAIMove() { state.thinking = false; if (state.over || state.paused) return; var depth = parseInt($('diff').value, 10) || 3; var counts = new Map(Object.keys(state.rep).map(function(k) { return [k, state.rep[k].n]; })); var mv = aiMove(state.board, state.turn, depth, 2500, counts); if (!mv) { refreshStatus(); renderAll(); return; } doMove(mv); }
function undo() { if (state.history.length === 0 || state.thinking) return; var times = state.mode === 'ai' ? 2 : 1; if (state.mode === 'watch') times = 2; for (var i = 0; i < times && state.history.length > 0; i++) state.history.pop(); var b = initialBoard(); state.rep = {}; state.pliesNoCap = 0; state.rep[positionKey(b, RED)] = newRepEntry(false, -1); for (var j = 0; j < state.history.length; j++) { var h = state.history[j]; var moverSide = j % 2 === 0 ? RED : BLACK; var wasCheckBefore = isInCheck(b, moverSide); makeMove(b, h.mv); var side = j % 2 === 0 ? BLACK : RED; applyTransforms(b); var wasChk = isInCheck(b, side); var wasChase = RULES.global.chaseIsLoss && !wasCheckBefore && !wasChk && h.mv.piece && h.mv.piece.t !== K && moveIsChase(b, h.mv); recordPosition(state.rep, b, side, wasChk, wasChase); state.pliesNoCap = h.cap ? 0 : state.pliesNoCap + 1; } state.board = b; state.turn = state.history.length % 2 === 0 ? RED : BLACK; state.plies = state.history.length; setPlies(state.plies); state.over = false; state.sel = null; state.legal = []; resetClocks(); refreshStatus(); renderAll(); scheduleAI(); }
function toggleFlip() { state.flip = !state.flip; boardEl.classList.toggle('flipped', state.flip); renderPieces(); renderMarks(); }
function togglePause() { state.paused = !state.paused; $('btnPause').textContent = state.paused ? '继续' : '暂停'; renderStatus(); if (!state.paused) scheduleAI(); }
function applyView() { state.flip = $('flipMenu').value === 'black'; buildBoardSvg(); renderPieces(); renderMarks(); }
function aiHint() { if (state.over || state.paused || state.thinking) return; var depth = parseInt($('diff').value, 10) || 3; var counts = new Map(Object.keys(state.rep).map(function(k) { return [k, state.rep[k].n]; })); var mv = aiMove(state.board, state.turn, depth, 2000, counts); if (mv) doMove(mv); }
$('btnNew').addEventListener('click', function() { newGame(); });
$('btnUndo').addEventListener('click', undo);
$('flipMenu').addEventListener('change', applyView);
$('chkFlipSide').addEventListener('change', applyView);
$('btnHint').addEventListener('click', aiHint);
$('btnPause').addEventListener('click', togglePause);
$('mode').addEventListener('change', function() { state.mode = this.value; $('btnHint').style.display = state.mode === 'pvp' || state.mode === 'ai' ? '' : 'none'; newGame(); });
boardEl.addEventListener('click', clickBoard);
applyBoardGeometry(); newGame();
