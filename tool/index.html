<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>游乐场 - 地荒资源站</title>
<style>
  :root {
    color-scheme: light;
    --bg: #fff;
    --text: #000;
    --text-secondary: #555;
    --border: #d0d0d0;
    --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
  }

  [data-theme="dark"] {
    color-scheme: dark;
    --bg: #000;
    --text: #fff;
    --text-secondary: #aaa;
    --border: #505050;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: var(--bg);
    font-family: var(--font-family);
    color: var(--text);
    transition: background 0.3s, color 0.3s;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 3rem 1.5rem;
  }

  /* --- Header --- */
  .header {
    text-align: center;
    margin-bottom: 3rem;
  }

  .header h1 {
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: 0.08em;
  }

  /* --- Card Grid --- */
  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 1.5rem;
    max-width: 900px;
    width: 100%;
  }

  .card {
    display: flex;
    align-items: center;
    gap: 1.2rem;
    padding: 1.5rem;
    background: var(--bg);
    border-radius: 8px;
    text-decoration: none;
    color: var(--text);
    transition: border-color 0.2s, background 0.2s, color 0.2s;
    border: 1px solid var(--border);
  }

  .card:hover {
    background: var(--text);
    color: var(--bg);
    border-color: var(--text);
  }

  .card-icon {
    width: 52px;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .card-icon svg { width: 26px; height: 26px; }

  .card-body {
    flex: 1;
    min-width: 0;
  }

  .card-title {
    font-size: 1.05rem;
    font-weight: 600;
    letter-spacing: 0.03em;
  }

  .card-arrow {
    color: var(--text-secondary);
    font-size: 1.1rem;
    transition: transform 0.3s, color 0.3s;
    flex-shrink: 0;
  }

  .card:hover .card-arrow {
    transform: translateX(4px);
    color: inherit;
  }

  /* --- Back Link --- */
  .back-link {
    margin-top: 3rem;
    font-size: 0.85rem;
    color: var(--text-secondary);
    text-decoration: none;
    letter-spacing: 0.05em;
    transition: color 0.3s;
  }

  .back-link:hover {
    color: var(--text);
  }

  /* --- Theme Toggle --- */
  .theme-toggle {
    position: fixed;
    top: 1.2rem;
    right: 1.5rem;
    min-width: 58px;
    min-height: 44px;
    padding: 0 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font: inherit;
    font-size: 0.85rem;
    z-index: 100;
  }

  .theme-toggle:hover {
    border-color: var(--text);
  }

  :focus-visible { outline: 2px solid var(--text); outline-offset: 4px; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }

  /* --- Responsive --- */
  @media (max-width: 600px) {
    body { padding: 2rem 1rem; }
    .header h1 { font-size: 1.5rem; }
    .card-grid { grid-template-columns: 1fr; gap: 1rem; }
    .card { padding: 1.2rem; gap: 1rem; }
    .card-icon { width: 44px; height: 44px; font-size: 1.3rem; }
    .card-title { font-size: 0.95rem; }
  }
</style>
</head>
<body>

<button class="theme-toggle" id="themeToggle" type="button" title="切换主题">深色</button>

<div class="header">
  <h1>游乐场</h1>
</div>

<div class="card-grid">

  <a class="card" href="/tool/sts.html">
    <div class="card-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="7" y="3" width="12" height="17" rx="2"/><path d="M5 6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h9m-4-11 3-3 3 3-3 3z"/></svg></div>
    <div class="card-body">
      <div class="card-title">杀戮尖塔随机卡牌</div>
    </div>
    <span class="card-arrow">&rarr;</span>
  </a>

  <a class="card" href="/tool/dhchess.html">
    <div class="card-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M8 9h8v6H8zm4-3v12"/></svg></div>
    <div class="card-body">
      <div class="card-title">地荒象棋</div>
    </div>
    <span class="card-arrow">&rarr;</span>
  </a>

  <a class="card" href="/tool/chesscraft/">
    <div class="card-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 12h16M12 4v16"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg></div>
    <div class="card-body">
      <div class="card-title">棋匠</div>
    </div>
    <span class="card-arrow">&rarr;</span>
  </a>

  <a class="card" href="/tool/risk.html">
    <div class="card-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="4" width="16" height="16" rx="4"/><circle cx="8" cy="8" r="1" fill="currentColor"/><circle cx="12" cy="12" r="1" fill="currentColor"/><circle cx="16" cy="16" r="1" fill="currentColor"/></svg></div>
    <div class="card-body">
      <div class="card-title">风险游戏</div>
    </div>
    <span class="card-arrow">&rarr;</span>
  </a>

</div>

<a class="back-link" href="/">&larr; 返回首页</a>

<script>
(function() {
  const toggle = document.getElementById('themeToggle');
  const html = document.documentElement;
  const saved = localStorage.getItem('dh-theme');
  if (saved) {
    html.setAttribute('data-theme', saved);
  } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
    html.setAttribute('data-theme', 'dark');
  }
  function updateToggle() {
    toggle.textContent = html.getAttribute('data-theme') === 'dark' ? '浅色' : '深色';
  }
  updateToggle();
  toggle.addEventListener('click', function() {
    const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', next);
    localStorage.setItem('dh-theme', next);
    updateToggle();
  });
})();
</script>

</body>
</html>
